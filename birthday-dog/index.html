<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307070a'/%3E%3Cpath d='M12 6h8v6l5 11a3 3 0 0 1-3 4H10a3 3 0 0 1-3-4l5-11z' fill='none' stroke='%23e8e6df' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="A birthday card with a dog on a checkerboard rug.">

<style>
  :root{
    --ink:#111111; --paper:#ffffff; --accent:#e8321e;
    --m:clamp(16px,3.2vw,40px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
  body{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:17px;line-height:1.35;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .back{position:fixed;top:14px;left:var(--m);z-index:5;font-size:16px;line-height:1.3;font-weight:700;color:var(--ink);text-decoration:none;padding:0}
  .back:hover{text-decoration:underline}
  .back:focus-visible,#stage:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  h1{position:absolute;z-index:0;left:var(--m);top:46px;margin:0;font-weight:400;
    font-size:clamp(34px,12vw,200px);line-height:.95;letter-spacing:-.01em;
    font-family:'Anton','Impact','Arial Narrow',sans-serif}
  h1 span{display:block;width:max-content;white-space:nowrap}

  #stage{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:none;cursor:default}

  .hint{position:fixed;z-index:3;right:var(--m);top:14px;margin:0;text-align:right;font-weight:700;font-size:16px;line-height:1.3;
    pointer-events:none;transition:opacity .5s ease}
  .hint.gone{opacity:0}
  .hint .mic{font:inherit;font-weight:800;background:none;border:0;padding:0;margin:0;color:var(--ink);cursor:pointer;
    text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;pointer-events:auto}
  .hint .mic:hover{color:var(--accent)}
  .hint .mic:active{transform:translateY(1px)}
  .hint .mic:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .hint .mic[hidden]{display:none}
  .notes{position:fixed;z-index:5;right:var(--m);bottom:calc(var(--m) * .75);display:inline-block;padding:12px 16px;
    background:var(--ink);color:var(--paper);font-weight:800;font-size:16px;line-height:1;text-decoration:none;
    transform:translate(130%,130%);opacity:0;visibility:hidden;
    transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease,visibility 0s linear .45s}
  .notes.in,.notes:focus-visible{transform:none;opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease,visibility 0s}
  .notes:hover{background:var(--accent)}
  .notes:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.notes{transform:none;transition:opacity .2s ease,visibility 0s linear .2s}.notes.in,.notes:focus-visible{transition:opacity .2s ease,visibility 0s}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .bubble{position:fixed;left:0;top:0;z-index:4;pointer-events:none;background:var(--ink);color:#fff;font-weight:800;
    font-size:22px;letter-spacing:-.02em;line-height:1;padding:11px 14px 12px;opacity:0;white-space:nowrap;
    transform-origin:0 100%;will-change:transform,opacity}
  .bubble::after{content:"";position:absolute;left:14px;bottom:-12px;border:8px solid transparent;border-top-color:var(--ink);border-left-color:var(--ink);border-bottom:0;border-right-width:0}

  #fallback{display:none;position:fixed;z-index:2;left:var(--m);right:var(--m);top:42%;font-size:clamp(20px,4vw,30px);font-weight:700;line-height:1.2}
  .nogl #fallback{display:block}
  .nogl .hint{display:none}

  .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .rise{animation:none}
    .hint{transition:none}
  }
</style>

<body>
<a class="back" href="../">← Labs</a>
<h1 id="title" aria-label="Happy birthday, Mama Candy"><span class="rise" style="--i:0" aria-hidden="true">Happy birthday,</span><span class="rise" style="--i:1" aria-hidden="true">Mama Candy</span></h1>
<canvas id="stage" tabindex="0" role="img" aria-label="A shih tzu on a checkerboard rug. Move the pointer to make it look, click it to pat it, drag the toy to throw it, tap the bottom of the screen (or press C) to bring out a birthday cake."></canvas>
<div class="bubble" id="bubble" aria-hidden="true">Woof.</div>
<p id="fallback">Your browser could not draw the dog, so here is the short version: happy birthday, Mama Candy.</p>
<p class="hint rise" style="--i:3" id="hint"><span id="hintText"></span> <button class="mic" id="micBtn" type="button" hidden>Blow into your mic</button></p>
<a class="notes" id="notes" href="direction/">Behind the design &rarr;</a>
<p class="sr" id="status" aria-live="polite"></p>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ CONFIG */
const CONFIG = {
  dogName: 'the birthday dog',
  person: 'Mama Candy',
  ink: '#111111',
  paper: '#ffffff',
  accent: '#e8321e',
  tile: 1.5,                // checker tile size in world units (bigger = calmer)
  cakePeekAt: 0.2,          // screen x (0-1) where the cake peeks in from the bottom
  cakeLitAt: 0.3,           // screen x it slides to when lit
  dashEvery: [8, 14],       // seconds idle before the dog zooms off left and back in from the right
  standLift: 0.3,            // raises the standing dog 
  sitLift: 0.35,            // raises the seated dog so his paws rest on the floor instead of sinking into it
  sitTurn: -0.5,            // extra turn (radians) toward the cake when sitting, so his left side faces us
  awkwardLeg: 1,            // Otto's trademark: this leg (0-3: front R, front L, back R, back L) sticks out sideways
  awkwardKick: 1.1,         // how far out it goes when he sits (radians)
  floorDark: '#cdcac6',     // the 'dark' checker square; paler = milder
  maxPixelRatio: 2,
  furScale: 1,              // 0.5 = lighter fur for slow devices
  homeYaw: 0.38,            // dog's resting three-quarter turn
  fov: 30,
  confettiCount: 320,
  barks: ['Woof.', 'Arf!', 'Yip!', 'Woof woof.', 'Again.', 'Hello.'],
  introLine: () => `${cap(CONFIG.dogName)} has been told to behave. It has not listened.`,
  wishLit: 'Close your eyes. Think of something good. Then blow out the candle.',
  hintLit: 'Make a wish. Blow into your mic',
  hintLitNoMic: 'Make a wish. Tap the candle.',
  hintPeek: 'Tap the bottom for cake.',
  blowMin: 0.05,            // quietest mic loudness (0-1) that can count as a blow
  blowRatio: 2.6,           // a blow has to be this many times louder than the room
  blowTime: 0.2,            // seconds it has to last
  wishDone: 'Wish sent. No refunds.',
  fetchLines: ['Good dog.', 'It always brings it back. Eventually.', 'Nobody asked for a slobbery toy. Here it is.'],
  mouthFull: 'Hold on, mouth full.',
};
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const canvas = $('stage'), h1 = $('title'), bubble = $('bubble'), statusEl = $('status'), hint = $('hint'), hintText = $('hintText'), micBtn = $('micBtn');
statusEl.textContent = CONFIG.wishLit;

/* -------------------------------------------------------------- renderer */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) { document.body.classList.add('nogl'); throw new Error('WebGL unavailable'); }
renderer.setClearColor(0x000000, 0);
let pixelRatio = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
renderer.setPixelRatio(pixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.fov, 1, 0.1, 200);

const INK = new THREE.Color(CONFIG.ink);
scene.add(new THREE.AmbientLight(0xffffff, 1.55));
const key = new THREE.DirectionalLight(0xfff2e0, 2.1); key.position.set(-3.5, 6, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0xffe0d0, 0.5); fill.position.set(4, 2, 2); scene.add(fill);

/* ------------------------------------------------------------- materials */
const gradTex = (() => {
  const d = new Uint8Array([120, 178, 225, 255]);
  const t = new THREE.DataTexture(d, 4, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
function toon(color = 0xffffff, rim = 0.35) {
  const m = new THREE.MeshToonMaterial({ color, gradientMap: gradTex });
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `float rimF = pow(1.0 - saturate(dot(normalize(vNormal), normalize(vViewPosition))), 2.6);
       outgoingLight += vec3(1.0,0.93,0.82) * rimF * ${rim.toFixed(2)};
       #include <opaque_fragment>`);
  };
  return m;
}
function outlineMat(w) {
  const m = new THREE.MeshBasicMaterial({ color: CONFIG.ink, side: THREE.BackSide });
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       transformed += normalize(normal) * ${w.toFixed(3)};`);
  };
  return m;
}
const furMat = toon(0xffffff, 0.3);
const baseMat = toon(0xffffff, 0.2);
const outFur = outlineMat(0.16);
const outBase = outlineMat(0.028);
const solid = (hex, rim = 0.2) => toon(new THREE.Color(hex), rim);

/* ------------------------------------------------------------ geometry */
const sphereG = new THREE.SphereGeometry(1, 28, 18);
const tuftG = new THREE.IcosahedronGeometry(1, 1); tuftG.scale(0.5, 1, 0.5); tuftG.translate(0, 0.82, 0);
const UP = new THREE.Vector3(0, 1, 0);
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

function ell(parent, radii, pos, mat, outline = true) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(sphereG, mat);
  m.scale.set(...radii);
  g.add(m);
  if (outline) {
    const o = new THREE.Mesh(sphereG, outBase);
    // inflate by scaling hull to a constant world thickness
    o.scale.set(radii[0] + 0.03, radii[1] + 0.03, radii[2] + 0.03);
    o.material = new THREE.MeshBasicMaterial({ color: CONFIG.ink, side: THREE.BackSide });
    g.add(o);
  }
  g.position.set(...pos);
  parent.add(g);
  return g;
}

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
function fur(parent, o) {
  const { radii: [a, b, c], center = [0, 0, 0], size = 0.18, colorFn, droop = 0.4, jitter = 0.3, keep, len = 1, sizeFn } = o;
  const count = Math.round(o.count * CONFIG.furScale);
  const mats = [], cols = [];
  let tries = 0;
  while (mats.length < count && tries < count * 8) {
    tries++;
    const n = new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1));
    if (n.lengthSq() > 1 || n.lengthSq() < 0.05) continue;
    n.normalize();
    const p = new THREE.Vector3(a * n.x, b * n.y, c * n.z);
    const nrm = new THREE.Vector3(n.x / a, n.y / b, n.z / c).normalize();
    const world = p.clone().add(new THREE.Vector3(...center));
    if (keep && !keep(world, nrm)) continue;
    const d = nrm.clone().add(new THREE.Vector3(0, -droop, 0))
      .add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(jitter)).normalize();
    _q.setFromUnitVectors(UP, d);
    const s = (sizeFn ? sizeFn(world, nrm) : size) * rnd(0.75, 1.3);
    _s.set(s, s * len, s);
    _p.copy(world).addScaledVector(nrm, -0.05);
    _m.compose(_p, _q, _s);
    mats.push(_m.clone());
    cols.push(colorFn(world, nrm));
  }
  const inst = new THREE.InstancedMesh(tuftG, furMat, mats.length);
  mats.forEach((m, i) => { inst.setMatrixAt(i, m); inst.setColorAt(i, cols[i]); });
  inst.instanceMatrix.needsUpdate = true;
  inst.frustumCulled = false;
  const out = new THREE.InstancedMesh(tuftG, outFur, mats.length);
  out.instanceMatrix = inst.instanceMatrix; out.frustumCulled = false;
  parent.add(out, inst);
  return inst;
}
const C = (h) => new THREE.Color(h);
const palette = (list) => () => C(pick(list)).offsetHSL(rnd(-0.01, 0.01), rnd(-0.03, 0.03), rnd(-0.03, 0.03));
const APRICOT = palette(['#e9a35d', '#df9348', '#f0b273', '#d58340']);
const RUST = palette(['#c06a33', '#b25a2b', '#cc7a40']);
const CREAM = palette(['#fff3e0', '#fde8cc', '#fbf0de']);
const DARK = '#3b2013';

/* --------------------------------------------------------------- the dog */
class Spring {
  constructor(k = 80, c = 9, x = 0) { this.k = k; this.c = c; this.x = x; this.v = 0; this.t = x; }
  step(dt) { this.v += (this.k * (this.t - this.x) - this.c * this.v) * dt; this.x += this.v * dt; return this.x; }
}

const dog = {};
{
  const root = new THREE.Group(); scene.add(root); dog.root = root;
  const rig = new THREE.Group(); root.add(rig); dog.rig = rig;       // squash and bob

  // body
  const body = new THREE.Group(); rig.add(body); dog.body = body;
  const BC = [0, 0.98, -0.5];
  ell(body, [0.74, 0.66, 0.98], BC, solid('#c9803f'), true);
  fur(body, {
    radii: [0.78, 0.7, 1.02], center: BC, count: 640, size: 0.18, droop: 0.55,
    colorFn: (p, n) => {
      if (n.y < -0.05 || (n.z > 0.55 && p.y < 1.25)) return CREAM();
      if (n.y < 0.3 && Math.abs(n.x) < 0.5 && n.z < -0.4) return APRICOT();
      return n.y > 0.5 ? (Math.random() < 0.6 ? RUST() : APRICOT()) : (Math.random() < 0.25 ? CREAM() : APRICOT());
    }
  });

  // legs
  dog.legs = [];
  const legDef = [[-0.4, 0.88, 0.1, 0], [0.4, 0.88, 0.1, 1], [-0.5, 0.82, -1.1, 1], [0.5, 0.82, -1.1, 0]];
  legDef.forEach(([x, y, z, ph], i) => {
    const leg = new THREE.Group(); leg.position.set(x, y, z); rig.add(leg);
    ell(leg, [0.27, 0.46, 0.27], [0, -0.38, 0], solid('#e8b57a'), true);
    ell(leg, [0.31, 0.17, 0.38], [0, -0.7, 0.1], solid('#fff0dc'), true);
    fur(leg, { radii: [0.3, 0.5, 0.3], center: [0, -0.4, 0], count: 70, size: 0.16, droop: 0.8,
      colorFn: (p) => p.y < -0.5 ? CREAM() : (Math.random() < 0.5 ? CREAM() : APRICOT()) });
    leg.userData.phase = ph; leg.userData.x0 = x; leg.userData.y0 = y;
    dog.legs.push(leg);
  });

  // tail
  const tail = new THREE.Group(); tail.position.set(0, 1.45, -1.38); rig.add(tail); dog.tail = tail;
  tail.rotation.x = -0.75;
  dog.tailSegs = [];
  let parent = tail;
  const segN = 5;
  for (let i = 0; i < segN; i++) {
    const seg = new THREE.Group();
    seg.position.y = i === 0 ? 0 : 0.3;
    seg.rotation.x = i === 0 ? 0 : 0.5;
    parent.add(seg);
    const r = 0.2 + i * 0.015;
    ell(seg, [r - 0.04, 0.2, r - 0.04], [0, 0.15, 0], solid('#d58a46'), true);
    fur(seg, { radii: [r + 0.02, 0.24, r + 0.02], center: [0, 0.15, 0], count: 62, size: 0.21 + i * 0.01, droop: 0.9, jitter: 0.5, len: 1.35,
      colorFn: () => (i > 2 && Math.random() < 0.55) ? CREAM() : (Math.random() < 0.3 ? CREAM() : APRICOT()) });
    dog.tailSegs.push(seg);
    parent = seg;
  }

  // head
  const head = new THREE.Group(); head.position.set(0, 1.4, 0.62); rig.add(head); dog.head = head;
  const HC = [0, 0.55, 0.25];
  const EYE = [[-0.3, 0.64, 0.93], [0.3, 0.64, 0.93]];
  head.scale.setScalar(1.2);
  const NOSE = new THREE.Vector3(0, 0.44, 1.31);
  ell(head, [0.7, 0.6, 0.64], HC, solid('#e6b078'), true);
  fur(head, {
    radii: [0.74, 0.64, 0.68], center: HC, count: 620, size: 0.2, droop: 0.35, jitter: 0.3,
    sizeFn: () => 0.165,
    keep: (p, n) => n.z < 0.5 && !(n.z > 0.2 && p.y < 0.8 && Math.abs(p.x) < 0.5 && false),
    colorFn: (p, n) => {
      if (n.z > 0.3 && p.y < 0.82) {
        for (const e of EYE) if (Math.hypot(p.x - e[0], p.y - e[1]) < 0.36) return C(Math.random() < 0.6 ? '#7b4423' : '#a2602f');
        return CREAM();
      }
      if (n.y > 0.55 && n.z > 0) return Math.random() < 0.4 ? CREAM() : APRICOT();
      if (Math.abs(n.x) > 0.7) return RUST();
      return Math.random() < 0.35 ? RUST() : APRICOT();
    }
  });
  fur(head, {
    radii: [0.72, 0.62, 0.66], center: HC, count: 300, size: 0.12, droop: 0.0, jitter: 0.15, len: 0.8,
    keep: (p, n) => {
      if (n.z < 0.5) return false;
      for (const e of EYE) if (Math.hypot(p.x - e[0], p.y - e[1]) < 0.3) return false;
      if (Math.abs(p.x) < 0.3 && p.y < 0.36) return false;
      return true;
    },
    colorFn: (p, n) => {
      for (const e of EYE) if (Math.hypot(p.x - e[0], p.y - e[1]) < 0.42) return C(Math.random() < 0.6 ? '#8a4c26' : '#b06a36');
      return p.y > 0.85 ? APRICOT() : CREAM();
    }
  });
  // topknot
  fur(head, { radii: [0.12, 0.1, 0.12], center: [0, 1.12, 0.45], count: 14, size: 0.18, droop: -0.6, jitter: 0.4, len: 1.4, colorFn: () => Math.random() < 0.5 ? CREAM() : APRICOT() });

  const toothZone = (p) => p.x < -0.02 && p.x > -0.36 && p.y < 0.28 && p.z > 1.08;   // keep fur off the canine
  // muzzle
  ell(head, [0.3, 0.22, 0.3], [0, 0.32, 1.0], solid('#fff0dc'), true);
  fur(head, { radii: [0.33, 0.25, 0.33], center: [0, 0.32, 1.0], count: 120, size: 0.11, droop: 0.5, jitter: 0.3,
    keep: (p, n) => !(p.y < 0.28 && Math.abs(p.x) < 0.25 && n.z > 0.1) && Math.hypot(p.x, p.y - NOSE.y, p.z - NOSE.z) > 0.15 && !toothZone(p),
    colorFn: () => CREAM() });
  // beard
  fur(head, { radii: [0.34, 0.12, 0.3], center: [0, 0.07, 0.92], count: 60, size: 0.13, droop: 1.2, jitter: 0.4, len: 1.3,
    keep: (p, n) => !(Math.abs(p.x) < 0.22 && n.z > 0.2 && p.y > 0.0) && !toothZone(p),
    colorFn: () => CREAM() });
  // nose
  const nose = ell(head, [0.14, 0.1, 0.1], NOSE.toArray(), solid('#161010', 0.1), false);
  const noseHi = new THREE.Mesh(sphereG, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  noseHi.scale.set(0.035, 0.022, 0.02); noseHi.position.set(-0.04, 0.045, 0.085); nose.add(noseHi);
  ell(head, [0.15, 0.11, 0.11], [0, 0.45, 1.27], solid('#161010', 0.1), true).scale.setScalar(0.01); // (placeholder keeps outline order stable)
  // mouth
  const mouth = new THREE.Group(); mouth.position.set(0, 0.17, 1.16); head.add(mouth); dog.mouth = mouth;
  const cav = new THREE.Mesh(sphereG, new THREE.MeshBasicMaterial({ color: '#2b0f12' }));
  cav.scale.set(0.21, 0.12, 0.12); cav.position.set(0, 0, 0); mouth.add(cav);
  const cavO = new THREE.Mesh(sphereG, new THREE.MeshBasicMaterial({ color: CONFIG.ink, side: THREE.BackSide }));
  cavO.scale.set(0.235, 0.145, 0.14); mouth.add(cavO);
  const tongue = new THREE.Group(); tongue.position.set(0, -0.03, 0.05); mouth.add(tongue); dog.tongue = tongue;
  const tg = new THREE.Mesh(sphereG, new THREE.MeshToonMaterial({ color: '#ff8a9a', gradientMap: gradTex }));
  tg.scale.set(0.12, 0.05, 0.17); tg.position.set(0, -0.03, 0.06); tongue.add(tg);
  const tgO = new THREE.Mesh(sphereG, new THREE.MeshBasicMaterial({ color: CONFIG.ink, side: THREE.BackSide }));
  tgO.scale.set(0.145, 0.07, 0.19); tgO.position.copy(tg.position); tongue.add(tgO);
  const tl = new THREE.Mesh(sphereG, new THREE.MeshBasicMaterial({ color: '#d2566a' }));
  tl.scale.set(0.012, 0.01, 0.12); tl.position.set(0, 0.0, 0.07); tongue.add(tl);
  // underbite: the chin juts past the muzzle, and the dog's right canine (screen left) pokes up over the lip

function screenY(x, y, z) { _v.set(x, y, z).project(camera); return (1 - _v.y) / 2 * view.h; }
function screenX(x, y, z) { _v.set(x, y, z).project(camera); return (_v.x + 1) / 2 * view.w; }
function xForScreenX(sx, y, z) {
  let lo = -40, hi = 40;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (screenX(mid, y, z) < sx) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function zForScreenY(sy) {

  return (lo + hi) / 2;
}
function fitHeadline() {
  const left = h1.offsetLeft || 16;
  const avail = window.innerWidth - left * 2;
  h1.style.fontSize = '100px';
  const spans = [...h1.querySelectorAll('span')];
  const wmax = Math.max(...spans.map((s) => s.getBoundingClientRect().width));
  let fs = (100 * avail) / wmax;
  fs = Math.min(fs, window.innerHeight * 0.185);
  h1.style.fontSize = fs.toFixed(1) + 'px';
  h1.style.top = (window.innerWidth < 600 ? 40 : 46) + 'px';
  return fs;
}
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  view.w = w; view.h = h;
  const fs = fitHeadline();
  const hb = h1.getBoundingClientRect().bottom;
  const overlap = window.innerWidth > 700 ? fs * 0.08 : 0;
  const cx = w / 2;
  const peekPx = THREE.MathUtils.clamp(h * 0.15, 78, 130);
  const top = hb - overlap, bot = h - peekPx * 0.7;
  const sh = Math.max(bot - top, 220), cy = (top + bot) / 2;
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tn = Math.tan(THREE.MathUtils.degToRad(CONFIG.fov / 2));
  const worldH = 4.6, worldW = 4.5 * (w / (2 * Math.min(cx, w - cx)));
  const dH = (worldH * h / sh) / (2 * tn);
  const dW = worldW / (2 * tn * camera.aspect);
  const d = Math.max(dH, dW);

  const pitch = 0.3, T = new THREE.Vector3(0, 1.15, 0.1);

  camera.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h);
  camera.updateMatrixWorld();
  const farZ = zForScreenY(hb + 8);
  floorMat.uniforms.uZFar.value = farZ;
  view.zBack = Math.max(farZ + 0.8, -2.6);
  view.zFront = THREE.MathUtils.clamp(zForScreenY(h - 40), 0.5, 2.3);
  view.bx = Math.min(4.2, d * tn * camera.aspect * 0.8 * (2 * Math.min(cx, w - cx) / w));
  view.cakeLitZ = THREE.MathUtils.clamp(zForScreenY(h * 0.84), 0.8, 4);
  const tipY = 1.02 * CAKE_S;
  let lo = -20, hi = camera.position.z - 1;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (screenY(0, tipY, mid) < h - peekPx) lo = mid; else hi = mid; }
  view.cakePeekZ = (lo + hi) / 2;
  view.cakePeekX = xForScreenX(w * CONFIG.cakePeekAt, tipY, view.cakePeekZ);
  view.cakeLitX = xForScreenX(w * CONFIG.cakeLitAt, 0.4, view.cakeLitZ);

}

    if (ac.state === 'suspended') ac.resume();   // created after the permission prompt, so it may start suspended (not awaited: it can stay pending)

let running = true, last = performance.now(), frameAcc = 0, frameN = 0;

  const dt = Math.min((now - last) / 1000, 0.05); last = now; T += dt;
  try { updateToy(dt); updateDog(dt); updateCake(dt); pollMic(dt); updateConfetti(dt); } catch (err) { if (!frame.warned) { frame.warned = 1; console.error('card update failed', err); } }
  toyShadow.position.set(toy.group.position.x, 0.016, toy.group.position.z);
  const ts = toy.carried ? 0.001 : 1.1 * (1 - Math.min(toy.group.position.y, 2) * 0.2);
  toyShadow.scale.set(ts, ts * 0.8, 1);
  hoverTimer += dt; if (hoverTimer > 0.05) { hoverTimer = 0; updateHover(); }
  updateBubble(dt);
  renderer.render(scene, camera);
  // adaptive resolution
