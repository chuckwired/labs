<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1d22">
<meta name="description" content="A birthday card for Mama Candy, with a dog on the couch.">
<title>Happy birthday, Mama Candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --ground: #2a1d22;
    --ink: #f6e9dc;
    --accent: #e7798f;
    --m: clamp(20px, 4vw, 52px);
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); overflow: hidden; }
  body {
    font-family: var(--serif);
    font-size: 17px; line-height: 1.5; font-weight: 380;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(120% 95% at 66% 56%, rgba(20,11,15,0) 38%, rgba(20,11,15,.72) 100%); }
  .back { position: fixed; z-index: 4; top: var(--m); left: var(--m); color: var(--ink); font-size: 14px;
    text-decoration: none; opacity: .75; padding: 4px 0; transition: opacity .2s, transform .2s; }
  .back:hover, .back:focus-visible { opacity: 1; transform: translateX(-2px); }
  .copy { position: fixed; z-index: 2; left: var(--m); top: calc(var(--m) + 44px); width: min(46vw, 760px); pointer-events: none; }
  h1 { margin: 0; font-weight: 340; font-size: clamp(42px, 6.4vw, 100px); line-height: .94; letter-spacing: -.035em;
    font-variation-settings: "opsz" 144; }
  h1 span { display: block; white-space: nowrap; }
  .lede { margin: 28px 0 0; max-width: 30ch; font-size: 18px; line-height: 1.45; color: var(--ink); }
  .actions { margin-top: 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
  button { font: inherit; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  button:focus-visible, .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .primary { background: var(--accent); color: #2a1d22; border: 0; border-radius: 999px; min-height: 52px; padding: 0 30px;
    font-size: 18px; font-weight: 520; letter-spacing: -.005em; }
  .primary:hover { transform: scale(1.04); }
  .primary:active { transform: scale(.96); }
  .link { background: none; border: 0; color: var(--ink); padding: 8px 0; font-size: 16px; text-decoration: underline;
    text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .link:hover { transform: translateX(3px); }
  .link:active { transform: scale(.96); }
  .link[hidden] { display: none; }
  #status { margin: 0; min-height: 1.5em; font-size: 16px; color: var(--ink); max-width: 34ch; }
  .bubble { position: fixed; z-index: 3; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: transform, opacity;
    background: var(--ink); color: var(--ground); border-radius: 18px 18px 18px 4px; padding: 8px 14px; font-size: 17px; line-height: 1.25;
    white-space: nowrap; font-weight: 440; transition: opacity .25s; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .rise.d1 { animation-delay: .08s; } .rise.d2 { animation-delay: .16s; } .rise.d3 { animation-delay: .24s; } .rise.d4 { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  #fallback { display: none; position: fixed; z-index: 5; right: var(--m); bottom: var(--m); max-width: 34ch;
    border-top: 1px solid var(--ink); padding-top: 12px; font-size: 16px; }
  #fallback.show { display: block; }
  @media (max-width: 859px), (max-aspect-ratio: 11/10) {
    .vignette { background: radial-gradient(130% 80% at 50% 62%, rgba(20,11,15,0) 40%, rgba(20,11,15,.7) 100%); }
    .copy { width: auto; right: var(--m); top: calc(var(--m) + 34px); }
    h1 { font-size: clamp(40px, 11.4vw, 84px); }
    .lede { margin-top: 16px; font-size: 16px; max-width: 32ch; }
    .actions { position: fixed; left: var(--m); right: var(--m); bottom: calc(var(--m) + env(safe-area-inset-bottom, 0px)); margin: 0; }
    .actions #status { order: -1; }
    #fallback { left: var(--m); right: var(--m); max-width: none; bottom: calc(var(--m) + 90px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; }
    button, .back, .bubble { transition: none; }
  }
</style>
</head>
<body>
<canvas id="stage" role="img" tabindex="0" aria-label="A shih tzu on a couch next to a grey plush toy. Click the dog, or drag the toy to throw it."></canvas>
<div class="vignette"></div>
<a class="back" href="../../">&larr; Labs</a>
<main class="copy">
  <h1 class="rise"><span>Happy birthday,</span><span>Mama Candy</span></h1>
  <p class="lede rise d1">The dog has been on the couch since breakfast, waiting. Say hello, throw the toy, then make a wish.</p>
  <div class="actions rise d2">
    <div class="row">
      <button id="wish" class="primary" type="button">Make a wish</button>
      <button id="mic" class="link" type="button" hidden>Or blow into your mic</button>
    </div>
    <p id="status" aria-live="polite"></p>
  </div>
</main>
<div id="bubble" class="bubble" aria-hidden="true"></div>
<div id="fallback" role="status">The 3D couch did not load on this device. The dog sends a wag anyway. Happy birthday, Mama Candy.</div>

<script type="module">
/* ---------------------------------------------------------------- CONFIG */
const CONFIG = {
  dogName: 'the birthday dog',
  recipient: 'Mama Candy',
  pixelRatioCap: 2,
  shells: null,            // null = auto (14 desktop, 9 phones)
  furLength: 0.7,          // multiplier on every fur length
  throwPower: 1.0,
  gravity: 18,
  petals: 110,
  micThreshold: 0.09,      // RMS 0..1 that counts as a blow
  micHoldSeconds: 0.22,
  barks: ['Woof.', 'Hello again.', 'Yes, I am very good.', 'Is that for me?', 'Woof. Obviously.', 'You rang?'],
  fetchLines: ['Here you go.', 'Delivered.', 'Again?'],
  wishLine: 'Wish made. We will not ask.',
  colors: {
    ground: '#2a1d22', ink: '#f6e9dc', accent: '#e7798f',
    rustRoot: '#7c3515', rustTip: '#e58e50', creamRoot: '#b79574', creamTip: '#f7e7d2',
    sofa: '#6e5762', rug1: '#1b1115', rug2: '#d5bcb0'
  }
};

const $ = (s) => document.querySelector(s);
const fallback = $('#fallback');
const failNow = (why) => { console.warn('card fallback:', why); fallback.classList.add('show'); };
const slow = setTimeout(() => { if (!window.__cardReady) failNow('slow'); }, 20000);

let THREE, RoundedBoxGeometry, mergeVertices;
try {
  THREE = await import('three');
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
  ({ mergeVertices } = await import('three/addons/utils/BufferGeometryUtils.js'));
} catch (e) { failNow(e); }
if (THREE) { try { main(); } catch (e) { console.error(e); failNow(e); } }

function main() {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = matchMedia('(pointer: coarse)').matches;
const { Vector3: V3, Color, Group, Mesh } = THREE;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const rand = (a, b) => a + Math.random() * (b - a);

/* ------------------------------------------------------------- renderer */
const canvas = $('#stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { failNow(e); return; }
if (!renderer.getContext()) { failNow('no context'); return; }
let dpr = Math.min(window.devicePixelRatio || 1, CONFIG.pixelRatioCap);
renderer.setPixelRatio(dpr);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); failNow('context lost'); });

const scene = new THREE.Scene();
scene.background = new Color(CONFIG.colors.ground);
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 80);
const camTarget = new V3(0, 0.8, 0.5);

const SHELLS = CONFIG.shells ?? (isTouch ? 9 : 14);

/* --------------------------------------------------------------- lights */
const hemi = new THREE.HemisphereLight(0x8a86b4, 0x4a2c33, 1.2);
scene.add(hemi);
const key = new THREE.SpotLight(0xffcfa6, 5, 0, 0.62, 1, 0);
key.position.set(6.5, 9, 5.5); key.target.position.set(0.4, 0, 0.3);
key.castShadow = true;
key.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
key.shadow.camera.near = 4; key.shadow.camera.far = 24; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 5;
scene.add(key, key.target);
const lamp = new THREE.PointLight(0xff9a55, 1.1, 0, 0);
lamp.position.set(5.2, 2.4, -0.6);
scene.add(lamp);
const flameLight = new THREE.PointLight(0xff9c4a, 0, 8, 1.6);
scene.add(flameLight);

/* shared uniforms for the fur shader (view-space light vectors) */
const U = {
  uKeyDir: { value: new V3() }, uKeyCol: { value: new Color(1.0, 0.72, 0.5) },
  uFillDir: { value: new V3() }, uFillCol: { value: new Color(0.20, 0.22, 0.40) },
  uAmb: { value: new Color(0.16, 0.12, 0.13) }, uRimCol: { value: new Color(1.0, 0.7, 0.5) },
  uMood: { value: 1 }, uFlamePos: { value: new V3() }, uFlameI: { value: 0 }
};
const keyWorld = new V3(0.55, 0.78, 0.62).normalize();
const fillWorld = new V3(-0.8, 0.25, 0.55).normalize();

/* -------------------------------------------------------------- textures */
function canvasTex(w, h, draw, rep = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 4; if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function fabricTex(base, rep) {
  return canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 16000; i++) { const v = Math.random() * 60 - 30; x.fillStyle = `rgba(${v > 0 ? 255 : 0},${v > 0 ? 220 : 0},${v > 0 ? 220 : 0},${Math.abs(v) / 260})`; x.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
    x.fillStyle = 'rgba(0,0,0,.14)'; for (let y = 0; y < h; y += 3) x.fillRect(0, y, w, 1);
    x.fillStyle = 'rgba(0,0,0,.10)'; for (let X = 0; X < w; X += 3) x.fillRect(X, 0, 1, h);
  }, rep);
}
function softDisc(inner = 0, outer = 1, col = '0,0,0', a = 1) {
  return canvasTex(128, 128, (x, w, h) => {
    const g = x.createRadialGradient(w / 2, h / 2, w * inner * 0.5, w / 2, h / 2, w * outer * 0.5);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });
}
const shadowTex = softDisc(0.0, 1, '8,4,6', 0.9);
const glowTex = softDisc(0.0, 1, '255,190,110', 1);
const smokeTex = softDisc(0.0, 1, '200,190,190', 0.5);

/* ----------------------------------------------------------------- sofa */
const sofaTex = fabricTex(CONFIG.colors.sofa, 3);
const sofaMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: sofaTex, bumpMap: sofaTex, bumpScale: 1.2, roughness: 0.95, metalness: 0 });
function box(w, h, d, r, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new Mesh(new RoundedBoxGeometry(w, h, d, 5, r), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
box(9.8, 1.2, 5.4, 0.28, sofaMat, 0, -0.6, 0.6);                    // seat (top at y=0)
box(9.8, 1.35, 0.9, 0.2, sofaMat, 0, -0.62, 3.55);                    // front rail
box(10.4, 4.4, 1.3, 0.35, sofaMat, 0, 1.4, -2.9);                     // back frame
box(4.5, 2.8, 1.25, 0.4, sofaMat, -2.35, 1.5, -1.8, -0.22, 0.02, 0);  // back cushions
box(4.5, 2.8, 1.25, 0.4, sofaMat, 2.35, 1.5, -1.8, -0.22, -0.02, 0);
box(1.3, 2.2, 5.8, 0.4, sofaMat, 5.35, 0.1, 0.4);                     // arms
box(1.3, 2.2, 5.8, 0.4, sofaMat, -5.35, 0.1, 0.4);
box(1.8, 1.5, 0.6, 0.28, sofaMat, 3.6, 0.7, 0.5, -0.3, -0.5, 0);      // throw pillow
const rugTex = canvasTex(512, 256, (x, w, h) => {
  const n = 8; x.fillStyle = CONFIG.colors.rug1; x.fillRect(0, 0, w, h);
  for (let j = 0; j < n / 2; j++) for (let i = 0; i < n; i++) if ((i + j) % 2) { x.fillStyle = CONFIG.colors.rug2; x.beginPath(); x.roundRect(i * (w / n) + 3, j * (h / (n / 2)) + 3, w / n - 6, h / (n / 2) - 6, 9); x.fill(); }
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,235,225'},.10)`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, [3, 1.6]);
const rug = new Mesh(new THREE.PlaneGeometry(16, 8), new THREE.MeshStandardMaterial({ map: rugTex, roughness: 1 }));
rug.rotation.x = -Math.PI / 2; rug.position.set(0, -1.28, 8.2); rug.receiveShadow = true; scene.add(rug);
const floor = new Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshStandardMaterial({ color: 0x241619, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, -1.3, 0); scene.add(floor);
const wall = new Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshStandardMaterial({ color: 0x3a2830, roughness: 1 }));
wall.position.set(0, 6, -6); scene.add(wall);
/* lamp, seen at the edge */
{
  const shadeMat = new THREE.MeshBasicMaterial({ color: 0xffc58a });
  const shade = new Mesh(new THREE.CylinderGeometry(0.55, 0.9, 1.1, 24, 1, true), shadeMat); shade.material.side = THREE.DoubleSide;
  shade.position.set(7.6, 3.6, -4); scene.add(shade);
  const stand = new Mesh(new THREE.CylinderGeometry(0.06, 0.1, 4.5, 10), new THREE.MeshStandardMaterial({ color: 0x1c1013, roughness: .6 }));
  stand.position.set(7.6, 0.9, -4); scene.add(stand);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xff9a55, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }));
  glow.scale.set(9, 9, 1); glow.position.set(7.2, 3.4, -4.4); scene.add(glow);
}

function blob(w, d, op = 0.55) {
  const m = new Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: op, polygonOffset: true, polygonOffsetFactor: -2 }));
  m.rotation.x = -Math.PI / 2; m.scale.set(w, d, 1); m.renderOrder = 1; return m;
}

/* ------------------------------------------------------------ fur shader */
const furVert = /* glsl */`
uniform float uLayer, uLen; uniform vec3 uDroop, uSway;
varying vec3 vN, vNo, vObj, vViewPos;
void main(){
  vObj = position; vNo = normal;
  float h = uLayer;
  vec3 p = position + normal * uLen * h + (uDroop + uSway) * uLen * h * h;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vViewPos = mv.xyz;
  vN = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * mv;
}`;
const furFrag = /* glsl */`
uniform float uLayer, uDensity, uSeed, uLong;
uniform vec3 uRoot, uTip, uCreamRoot, uCreamTip, uMaskDir; uniform vec2 uMask;
uniform vec3 uKeyDir, uKeyCol, uFillDir, uFillCol, uAmb, uRimCol, uFlamePos; uniform float uMood, uFlameI;
varying vec3 vN, vNo, vObj, vViewPos;
float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
void main(){
  float cov = 1.0; float r = 0.5; float clump = 0.5;
  vec3 a = abs(vNo);
  vec2 uv = (a.x > a.y && a.x > a.z) ? vObj.yz : ((a.y > a.z) ? vObj.xz : vObj.xy);
  vec2 c = uv * uDensity + uSeed;
  vec2 id = floor(c); vec2 f = fract(c) - 0.5;
  r = h21(id);
  clump = h21(floor(c * 0.2) + 11.0);
  if (uLayer > 0.0) {
    vec2 off = (vec2(h21(id + 7.1), h21(id + 3.3)) - 0.5) * 0.45;
    float d = length(f - off);
    float hgt = mix(0.3, 1.0, mix(r, clump, 0.55));
    hgt = mix(hgt, 1.0, uLong * 0.5);
    float rad = 0.68 * (1.0 - 0.55 * uLayer / max(hgt, 0.2));
    cov = clamp((rad - d) / 0.14, 0.0, 1.0) * step(uLayer, hgt);
    if (cov < 0.02) discard;
  }
  float m = smoothstep(uMask.x, uMask.y, dot(vObj, uMaskDir) + (r - 0.5) * 0.10 + (clump - 0.5) * 0.12);
  vec3 root = mix(uRoot, uCreamRoot, m), tip = mix(uTip, uCreamTip, m);
  vec3 base = mix(root, tip, pow(uLayer, 0.75));
  base *= 0.82 + 0.3 * r; base *= 0.9 + 0.2 * clump;
  vec3 N = normalize(vN); vec3 V = normalize(-vViewPos);
  float key = pow(clamp(dot(N, uKeyDir) * 0.5 + 0.5, 0.0, 1.0), 1.5);
  float fill = clamp(dot(N, uFillDir) * 0.5 + 0.5, 0.0, 1.0);
  vec3 light = uKeyCol * key * uMood + uFillCol * fill + uAmb;
  vec3 Lf = uFlamePos - vViewPos; float dl = length(Lf);
  light += vec3(1.0, 0.55, 0.22) * uFlameI * (max(dot(N, Lf / dl), 0.0) * 0.8 + 0.2) / (1.0 + 0.18 * dl * dl);
  float ao = mix(0.22, 1.0, smoothstep(0.0, 0.75, uLayer));
  float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.4);
  vec3 col = base * light * ao + uRimCol * rim * 0.42 * uMood * (0.3 + 0.7 * uLayer) * base * 1.6;
  col += uKeyCol * pow(max(dot(N, normalize(uKeyDir + V)), 0.0), 18.0) * 0.07 * uLayer * uMood;
  gl_FragColor = vec4(col, cov);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

function ellGeo(rx, ry, rz, ws = 28, hs = 20) {
  let g = new THREE.SphereGeometry(1, ws, hs);
  g.deleteAttribute('uv'); g.deleteAttribute('normal');
  g = mergeVertices(g, 1e-4);
  g.scale(rx, ry, rz); g.computeVertexNormals();
  return g;
}
const c3 = (h) => new Color(h);
let seedCounter = 1;
/* a fur-shelled ellipsoid */
function fur(o) {
  const g = new Group();
  const N = o.layers ?? SHELLS;
  const geo = ellGeo(o.r[0], o.r[1], o.r[2], o.ws ?? 28, o.hs ?? 20);
  const col = CONFIG.colors;
  const common = {
    uLen: { value: o.len * CONFIG.furLength }, uRoot: { value: c3(o.root ?? col.rustRoot) }, uTip: { value: c3(o.tip ?? col.rustTip) },
    uCreamRoot: { value: c3(o.cRoot ?? col.creamRoot) }, uCreamTip: { value: c3(o.cTip ?? col.creamTip) },
    uMaskDir: { value: new V3(...(o.maskDir ?? [0, -1, 0])) }, uMask: { value: new Vector2Fallback(o.mask ?? [9, 10]) },
    uDensity: { value: o.dens ?? 26 }, uSeed: { value: (seedCounter++) * 3.7 }, uLong: { value: o.long ?? 0 },
    uDroop: { value: new V3(0, -(o.droop ?? 0.35), 0) }, uSway: { value: new V3() }
  };
  g.userData.sway = common.uSway;
  for (let i = 0; i < N; i++) {
    const layer = i / (N - 1);
    const mat = new THREE.ShaderMaterial({
      uniforms: Object.assign({ uLayer: { value: layer } }, U, common),
      vertexShader: furVert, fragmentShader: furFrag, alphaToCoverage: true
    });
    const m = new Mesh(geo, mat); g.add(m);
  }
  if (o.pos) g.position.set(...o.pos);
  if (o.rot) g.rotation.set(...o.rot);
  return g;
}
function Vector2Fallback(a) { return new THREE.Vector2(a[0], a[1]); }

/* -------------------------------------------------------------- the dog */
const dog = new Group(); scene.add(dog);                  // floor position
const rig = new Group(); dog.add(rig);                    // yaw + hops
const hidden = () => new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });

  camera.aspect = w / h;
  wide = w >= 860 && w / h > 1.1;
  const W = wide ? 6.6 : (w / h > 0.8 ? 7.5 : 4.5);
  baseDist = clamp(W / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect), 7, 22);
  camShift.x = wide ? w * 0.16 : 0;
  camShift.y = wide ? 0 : -h * 0.05;

  cake.position.x = wide ? -2.3 : -W * 0.5 + 0.9; cake.position.z = wide ? 1.6 : 1.0;

const ptr = { x: 0, y: 0, has: false, down: false, over: false, idle: 0 };
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const plane = new THREE.Plane(new V3(0, 1, 0), 0);
function setNDC(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ptr.x = ndc.x; ptr.y = ndc.y; ptr.has = true; ptr.idle = 0; ray.setFromCamera(ndc, camera); }
function groundHit(y, out) { plane.constant = -y; return ray.ray.intersectPlane(plane, out); }
function hitDog() { return ray.intersectObjects([headProxy, bodyProxy], false).length > 0; }
function hitToy() { return (T.mode === 'rest' || T.mode === 'fly') && !T.carried && ray.intersectObject(toyProxy, false).length > 0; }
function hitCake() { return cake.visible && ray.intersectObject(cakeProxy, false).length > 0; }

const drag = { on: false, id: -1, last: new V3(), vel: new V3(), t: 0, pt: new V3() };
const D = { hover: false, curious: 0 };
canvas.addEventListener('pointerdown', (e) => {
  setNDC(e); ptr.down = true;
  if (wishState === 'lit' && hitCake()) { blowOut('click'); return; }
  if (hitToy()) {
    drag.on = true; drag.id = e.pointerId; canvas.setPointerCapture(e.pointerId);
    T.mode = 'drag'; T.fetched = false; T.v.set(0, 0, 0); drag.vel.set(0, 0, 0); drag.t = performance.now();
    if (groundHit(0.9, drag.pt)) drag.last.copy(drag.pt);
    if (dogMode !== 'idle' && dogMode !== 'home') dogMode = 'idle';
    canvas.style.cursor = 'grabbing'; return;
  }
  if (hitDog()) pet();
});
canvas.addEventListener('pointermove', (e) => {
  setNDC(e);
  if (drag.on) {
    if (groundHit(0.9, drag.pt)) {
      const now = performance.now(), dt = Math.max(1, now - drag.t) / 1000;
      const v = drag.pt.clone().sub(drag.last).divideScalar(dt);
      drag.vel.lerp(v, 0.4); drag.last.copy(drag.pt); drag.t = now;
      toy.position.x = clamp(drag.pt.x, BOUNDS.x0 - 0.6, BOUNDS.x1 + 0.6); toy.position.z = clamp(drag.pt.z, BOUNDS.z0, BOUNDS.z1 + 0.4);
    }
    return;
  }
  D.hover = hitDog();
  canvas.style.cursor = hitToy() || hitCake() ? 'grab' : (D.hover ? 'pointer' : 'default');
});
function endDrag(e) {
  if (!drag.on) return; drag.on = false; ptr.down = false;
  try { canvas.releasePointerCapture(drag.id); } catch (_) {}
  const stale = performance.now() - drag.t > 90;
  const p = CONFIG.throwPower;
  T.v.set(stale ? 0 : clamp(drag.vel.x * p, -16, 16), 2 + (stale ? 0 : Math.min(5, drag.vel.length() * 0.18)), stale ? 0 : clamp(drag.vel.z * p, -16, 16));

}

let mic = null;
async function startMic() {
  if (mic) return;
  if (!navigator.mediaDevices?.getUserMedia) { setStatus('No mic here. Click the candle instead.'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
    mic = { stream, ctx, an, buf: new Float32Array(an.fftSize), hold: 0 };
    micBtn.textContent = 'Listening. Blow at the screen.'; setStatus('Listening. Blow gently, or just click the candle.');
  } catch (e) { setStatus('No mic, no problem. Click the candle.'); }
}
function stopMic() { if (!mic) return; mic.stream.getTracks().forEach((t) => t.stop()); mic.ctx.close(); mic = null; }
micBtn.addEventListener('click', startMic);
function pollMic(dt) {
  if (!mic || wishState !== 'lit') return;
  mic.an.getFloatTimeDomainData(mic.buf); let s = 0; for (let i = 0; i < mic.buf.length; i++) s += mic.buf[i] * mic.buf[i];
  const rms = Math.sqrt(s / mic.buf.length);
  mic.hold = rms > CONFIG.micThreshold ? mic.hold + dt : Math.max(0, mic.hold - dt);
  if (mic.hold > CONFIG.micHoldSeconds) blowOut('mic');
}

const tmpV = new V3(), tmpV2 = new V3(), headW = new V3();
const spring = (o, target, k, d, dt) => { o.v += (-k * (o.x - target) - d * o.v) * dt; o.x += o.v * dt; };

function updateToy(dt) {
  const p = toy.position;
  if (T.mode === 'fly') {
    T.v.y -= CONFIG.gravity * dt; p.addScaledVector(T.v, dt);
    toy.rotation.x += T.spin.x * dt; toy.rotation.z += T.spin.z * dt;
    if (p.x < BOUNDS.x0) { p.x = BOUNDS.x0; T.v.x *= -0.45; } if (p.x > BOUNDS.x1) { p.x = BOUNDS.x1; T.v.x *= -0.45; }

function updateWish(dt) {

function updateCamera(dt) {

function updateBubble(dt) {

let raf = 0, last = 0, frames = 0, acc = 0;
