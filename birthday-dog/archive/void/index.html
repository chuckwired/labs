<style>
/* Void party: labs house tokens (DESIGN.md). One ground, one ink, one accent (coral). */
:root {
  color-scheme: dark;
  --bg: #07070a;
  --ink: #e8e6df;
  --dim: #8b8a93;
  --line: rgba(255, 255, 255, 0.10);
  --accent: #ff6b57;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.6 var(--mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; view-transition-name: lab-art; background: var(--bg); touch-action: none; user-select: none; -webkit-user-select: none; }
#dots, #stars, #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dots, #stars { pointer-events: none; }
#gl { touch-action: none; outline: none; }
#gl.grab { cursor: grab; }
#gl.grabbing { cursor: grabbing; }
#gl.poke { cursor: pointer; }

.back {
  position: fixed; z-index: 50;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  font: 400 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  color: var(--dim); text-decoration: none;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px;
  transition: color .2s, border-color .2s, transform .2s var(--ease);
}
.back:hover { color: var(--ink); border-color: rgba(255,255,255,.35); }
.back:active { transform: scale(.96); }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.copy, .actions, .hint {
  position: fixed; z-index: 20; pointer-events: none;
  left: calc(env(safe-area-inset-left, 0px) + 40px);
}
.copy { bottom: calc(env(safe-area-inset-bottom, 0px) + 118px); width: min(48vw, 680px); }
h1 {
  margin: 0; font: italic 400 clamp(44px, 9vw, 96px)/.95 var(--serif);
  letter-spacing: -.01em; text-wrap: balance; color: var(--ink);
}
.lede {
  margin: 22px 0 0; max-width: 46ch; color: var(--dim);
  font: 400 17px/1.55 var(--mono);
  transition: opacity .35s var(--ease), transform .35s var(--ease);
}
.lede.swap { opacity: 0; transform: translateY(8px); }
.actions { bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); display: flex; align-items: center; gap: 22px; pointer-events: none; }
.actions > * { pointer-events: auto; }
button { font: inherit; }
.primary {
  appearance: none; cursor: pointer; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--bg);
  font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  min-height: 46px; padding: 0 26px;
  transition: transform .2s var(--ease), opacity .2s;
}
.primary:hover { transform: translateY(-2px); }
.primary:active { transform: scale(.96); }
.primary[disabled] { opacity: .45; cursor: default; transform: none; }
.quiet {
  appearance: none; background: none; border: 0; border-bottom: 1px solid rgba(255,255,255,.25);
  color: var(--ink); cursor: pointer; padding: 0 0 3px;
  font: 400 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
  transition: border-color .2s, opacity .3s var(--ease), transform .2s var(--ease);
}
.quiet:hover { border-color: var(--ink); }
.quiet:active { transform: scale(.96); }
.quiet[hidden] { display: none; }
.hint {
  left: auto; right: calc(env(safe-area-inset-right, 0px) + 40px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 46px);
  font: 400 11px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); text-align: right;
  transition: opacity .6s;
}
.hint.gone { opacity: 0; }

.bubble {
  position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
  padding: 8px 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
  background: var(--bg); color: var(--ink);
  font: 400 12px/1 var(--mono); letter-spacing: .06em; white-space: nowrap;
  opacity: 0; will-change: transform, opacity;
}
.bubble.on { opacity: 1; }

#fallback { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
#fallback p { max-width: 36ch; margin: 0; font: italic 400 30px/1.15 var(--serif); }
#fallback small { display: block; margin-top: 16px; color: var(--dim); font: 400 12px/1.5 var(--mono); }
body.nogl #fallback { display: flex; }
body.nogl .actions, body.nogl .hint { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .9s var(--ease) both; animation-delay: calc(var(--i) * 80ms + 200ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @view-transition { navigation: auto; }
}
::view-transition-group(lab-art) { animation-duration: .5s; animation-timing-function: var(--ease); }

@media (max-width: 760px) {
  .copy { top: calc(env(safe-area-inset-top, 0px) + 64px); bottom: auto; left: 20px; right: 20px; width: auto; }
  .lede { font-size: 15px; margin-top: 14px; }
  .actions { left: 20px; right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); justify-content: space-between; }
  .actions .primary { flex: 1 1 auto; max-width: 240px; }
  .hint { display: none; }
  .back { left: 20px; }
}
</style>
</head>
<body>
<div id="stage" aria-label="A shih tzu floating in the void with a plush toy and a birthday cake">
  <canvas id="dots" aria-hidden="true"></canvas>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="gl" tabindex="-1"></canvas>
</div>

<a class="back rise" style="--i:0" href="../../../">&larr; Labs</a>

<div class="copy">
  <h1 class="rise" style="--i:1">Happy birthday, Mama Candy</h1>
  <p class="lede rise" style="--i:2" id="lede"></p>
</div>
<div class="actions rise" style="--i:3">
  <button class="primary" id="act" type="button">Light the candles</button>
  <button class="quiet" id="mic" type="button" hidden>Or blow into the mic</button>
</div>
<div class="hint rise" style="--i:4" id="hint">Drag the toy<br>Poke the dog</div>

<div class="bubble" id="bubble" aria-hidden="true"></div>
<div class="sr" role="status" aria-live="polite" id="live"></div>

<div id="fallback" role="alert"><p>Happy birthday, Mama Candy.<small>There was meant to be a dog floating here with a cake. Your browser could not draw it, so you get this instead. Imagine a small, smug shih tzu.</small></p></div>
<noscript><p style="position:fixed;left:20px;bottom:20px;margin:0;color:#8b8a93;font:12px monospace">Happy birthday, Mama Candy. This card needs JavaScript for the dog.</p></noscript>

<script type="module">
'use strict';

/* ---------- tunables ---------- */
const CONFIG = {
  dogName: 'the birthday dog',
  accent: '#ff6b57',          // the one party colour
  furShells: 16,              // fur layers per part (governor may lower)
  maxPixelRatio: 2,
  floatAmp: 0.07,             // dog bob, world units
  tiltY: 0.42, tiltX: 0.26,   // mouse-driven figure tilt (radians)
  orbitSpeed: 0.38,           // plush orbit, rad/s
  candleCount: 5,
  candleGap: 0.42,            // seconds between ignitions
  confetti: 150,              // paper scraps
  starsOnCelebrate: 20,
  ambientStarGap: [7, 16],    // seconds
  dots: 170,
  barks: ['woof.', 'yip.', 'yes, hello.', 'excuse me?', 'noted.', 'ruff.'],
  celebrateBarks: ['happy birthday!', 'woof! (cake?)'],
  copy: {
    idle:    'The dog is in charge of the candles. Poke it, throw the toy, then light the cake.',
    lit:     'Make a wish. Keep it to yourself.',
    wished:  'Sent. Now blow, or click.',
    done:    'Wish received. The dog is taking credit.',
    nomic:   'No mic, no problem. Click works too.',
  },
};

const $ = (id) => document.getElementById(id);
const live = $('live');
const lede = $('lede');
const actBtn = $('act');
const micBtn = $('mic');
const hintEl = $('hint');
const bubble = $('bubble');
const glCv = $('gl');
const dotsCv = $('dots');
const starsCv = $('stars');
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let RM = reduceMQ.matches;
reduceMQ.addEventListener?.('change', () => { RM = reduceMQ.matches; });

function setLede(text, announce = true) {
  lede.classList.add('swap');
  setTimeout(() => { lede.textContent = text; lede.classList.remove('swap'); }, RM ? 0 : 280);
  if (announce) live.textContent = text;
}
lede.textContent = CONFIG.copy.idle;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
lede.textContent = lede.textContent.replace('The dog', cap(CONFIG.dogName));
CONFIG.copy.idle = lede.textContent;
function fallback() {
  document.body.classList.add('nogl');
  glCv.style.display = 'none';
}

let THREE;
try { THREE = await import('three'); } catch (e) { fallback(); throw e; }

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glCv, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) { fallback(); throw e; }
if (!renderer.getContext()) { fallback(); throw new Error('no webgl'); }
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 60);
const world = new THREE.Group();
scene.add(world);

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hex = (s) => { const n = parseInt(s.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hash = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
const rand = (a, b) => a + Math.random() * (b - a);

class Spring {
  constructor(k = 80, d = 7) { this.x = 0; this.v = 0; this.k = k; this.d = d; }
  step(dt, target = 0) {
    const n = Math.max(1, Math.ceil(dt / 0.008)); const h = dt / n;
    for (let i = 0; i < n; i++) { this.v += ((target - this.x) * this.k - this.v * this.d) * h; this.x += this.v * h; }
    return this.x;
  }
}

const C = {
  rust: hex('#c06a30'), apricot: hex('#e09a5c'), cream: hex('#f0dcc0'), white: hex('#f8f1e7'),
  dark: hex('#3a2012'), grey: hex('#a4a7ab'), greyDk: hex('#85888c'),
};
const ACC = hex(CONFIG.accent);

/* ---------- fur: instanced shells, noise-cell strands ---------- */
const U = {
  uTime: { value: 0 },
  uKey: { value: new THREE.Vector3(-0.5, 0.7, 0.55).normalize() },
  uKeyCol: { value: new THREE.Vector3(0.85, 0.74, 0.62) },
  uAmb: { value: new THREE.Vector3(0.6, 0.52, 0.5) },
  uRimDir: { value: new THREE.Vector3(0.8, 0.25, -0.55).normalize() },
  uRimCol: { value: new THREE.Vector3(...ACC) },
  uCandle: { value: new THREE.Vector3() },
  uCandleI: { value: 0 },
  uCandleCol: { value: new THREE.Vector3(1.0, 0.62, 0.42) },
};
const furVS = /* glsl */`
uniform float uLen, uShells, uDroop, uTime, uWind;
varying vec3 vN, vP0, vPv, vCol;
varying float vL;
void main(){
  float l = uShells > 1.5 ? float(gl_InstanceID) / (uShells - 1.0) : 0.0;
  vec3 p = position + normal * uLen * l;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  vec3 down = (viewMatrix * vec4(0.0, -1.0, 0.0, 0.0)).xyz;
  float sway = sin(uTime * 1.3 + position.y * 3.0 + position.x * 2.0);
  mv.xyz += down * uDroop * l * l + vec3(sway, 0.0, 0.0) * uWind * l * l;
  vN = normalize(normalMatrix * normal);
  vP0 = position; vPv = mv.xyz; vCol = color; vL = l;
  gl_Position = projectionMatrix * mv;
}`;
const furFS = /* glsl */`
precision highp float;
uniform float uDens, uGloss;
uniform vec3 uKey, uKeyCol, uAmb, uRimDir, uRimCol, uCandle, uCandleCol;
uniform float uCandleI;
varying vec3 vN, vP0, vPv, vCol;
varying float vL;
float h31(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }
void main(){
  float l = vL;
  vec3 q = vP0 * uDens; vec3 c = floor(q); vec3 f = fract(q) - 0.5;
  float r1 = h31(c);
  vec3 j = vec3(h31(c + 17.1), h31(c + 39.7), h31(c + 71.3)) - 0.5;
  float d = length(f - j * 0.55);
  float clump = h31(floor(vP0 * uDens * 0.16));
  float height = (0.4 + 0.6 * r1) * (0.78 + 0.44 * clump);
  if (l > 0.001) { float rad = 0.5 * (1.0 - l * 0.78); if (l > height || d > rad * 0.92) discard; }
  vec3 N = normalize(vN); vec3 V = normalize(-vPv);
  float ndl = dot(N, uKey) * 0.5 + 0.5; ndl *= ndl;
  float ao = mix(0.5, 1.0, l);
  vec3 col = vCol * (0.9 + 0.2 * r1) * (0.9 + 0.2 * clump);
  vec3 lit = col * (uAmb + ndl * uKeyCol) * ao;
  float fres = pow(1.0 - max(dot(N, V), 0.0), 2.2);
  float rim = fres * (0.3 + 0.7 * max(dot(N, uRimDir) * 0.5 + 0.5, 0.0));
  lit += uRimCol * rim * (0.2 + 0.8 * l) * 0.85;
  vec3 toC = uCandle - vPv; float dist = length(toC);
  float cl = max(dot(N, toC / dist), 0.0) * uCandleI / (1.0 + dist * dist * 0.5);
  lit += col * uCandleCol * cl * (0.4 + 0.6 * l);
  lit += uGloss * pow(max(dot(N, normalize(uKey + V)), 0.0), 24.0) * l * 0.25;
  gl_FragColor = vec4(lit, 1.0);
}`;

const furMeshes = [];
let activeShells = CONFIG.furShells;
const unitSphere = new THREE.SphereGeometry(1, 26, 18);
function furGeo(colorFn) {
  const g = unitSphere.clone();
  const p = g.attributes.position, n = p.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const c = colorFn(x, y, z); const jit = (hash(x * 9, y * 9, z * 9) - 0.5) * 0.04;
    col[i * 3] = clamp(c[0] + jit, 0, 1); col[i * 3 + 1] = clamp(c[1] + jit, 0, 1); col[i * 3 + 2] = clamp(c[2] + jit, 0, 1);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
function fur(o) {
  const { scale, pos = [0, 0, 0], rot = [0, 0, 0], len = 0.1, dens = 40, droop = 0.015, wind = 0.004, shells = CONFIG.furShells, color } = o;
  const mat = new THREE.ShaderMaterial({
    vertexShader: furVS, fragmentShader: furFS, vertexColors: true,
    uniforms: Object.assign({
      uLen: { value: len }, uShells: { value: shells }, uDroop: { value: droop }, uWind: { value: wind },
      uDens: { value: dens * 0.72 }, uGloss: { value: o.gloss ?? 0.4 },
    }, U),
  });
  const m = new THREE.InstancedMesh(furGeo(color), mat, shells);
  const id = new THREE.Matrix4(); for (let i = 0; i < shells; i++) m.setMatrixAt(i, id);
  m.frustumCulled = false;
  m.scale.set(...scale); m.position.set(...pos); m.rotation.set(...rot);
  m.userData.maxShells = shells;
  furMeshes.push(m);
  return m;
}
function setShells(n) {
  activeShells = n;
  for (const m of furMeshes) { const s = Math.min(n, m.userData.maxShells); m.count = s; m.material.uniforms.uShells.value = s; }
}
const std = (c, r = 0.5, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const ell = (geoMat, s, p = [0, 0, 0]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), geoMat); m.scale.set(...s); m.position.set(...p); return m; };

/* ---------- lights (for the non-fur bits) ---------- */
scene.add(new THREE.AmbientLight(0x9a9cc0, 0.55));
const keyL = new THREE.DirectionalLight(0xffe2cc, 2.4); keyL.position.set(-3, 4, 5); scene.add(keyL);
const rimL = new THREE.DirectionalLight(new THREE.Color(CONFIG.accent), 3.2); rimL.position.set(4, 2, -3); scene.add(rimL);
const candleL = new THREE.PointLight(0xff9a6a, 0, 5, 1.6); world.add(candleL);

/* ---------- DOG ---------- */
const dog = new THREE.Group();            // dog root: pose, tilt
const dogHolder = new THREE.Group();      // lunge / jump / float offsets
world.add(dogHolder); dogHolder.add(dog);

const bodyG = new THREE.Group(); bodyG.position.set(0, -0.38, -0.12); dog.add(bodyG);
bodyG.add(fur({
  scale: [0.6, 0.52, 0.8], len: 0.11, dens: 34, droop: 0.03,
  color: (x, y, z) => {
    let c = mix3(C.rust, C.apricot, smooth(-0.2, 0.7, y) * 0.5 + hash(Math.floor(x * 4), 0, Math.floor(z * 4)) * 0.25);
    c = mix3(c, C.cream, smooth(-0.15, -0.75, y) * 0.9);
    return mix3(c, C.white, smooth(0.35, 0.9, z) * smooth(0.4, -0.6, y) * 0.8);
  },
}));
bodyG.add(fur({ scale: [0.4, 0.4, 0.32], pos: [0, -0.1, 0.52], len: 0.1, dens: 40, droop: 0.03, color: (x, y, z) => mix3(C.white, C.cream, smooth(0.2, -0.8, y) * 0.5) }));
for (const s of [-1, 1]) {
  bodyG.add(fur({ scale: [0.3, 0.34, 0.4], pos: [s * 0.44, -0.16, -0.3], len: 0.11, dens: 40, droop: 0.03, color: (x, y, z) => mix3(C.rust, C.cream, smooth(0, -0.9, y) * 0.5) }));
  bodyG.add(fur({ scale: [0.17, 0.1, 0.23], pos: [s * 0.42, -0.57, -0.02], len: 0.1, dens: 60, droop: 0.01, color: () => C.cream }));
  bodyG.add(fur({ scale: [0.14, 0.34, 0.15], pos: [s * 0.2, -0.5, 0.48], len: 0.1, dens: 55, droop: 0.02, color: (x, y) => mix3(C.cream, C.apricot, smooth(0.2, 1, y) * 0.6) }));
  bodyG.add(fur({ scale: [0.16, 0.1, 0.21], pos: [s * 0.2, -0.82, 0.55], len: 0.09, dens: 60, droop: 0.01, color: () => C.white }));
}

const headP = new THREE.Group(); headP.position.set(0, 0.36, 0.5); dog.add(headP);
const headRoot = new THREE.Group(); headRoot.position.set(0, 0.12, 0.04); headP.add(headRoot);
headRoot.add(fur({
  scale: [0.5, 0.44, 0.47], len: 0.12, dens: 42, droop: 0.02,
  color: (x, y, z) => {
    let c = mix3(C.white, C.apricot, smooth(0.15, 0.7, y) * 0.9);
    c = mix3(c, C.rust, smooth(0.35, 0.9, y) * smooth(0.5, -0.3, z) * 0.9);
    return mix3(c, C.rust, smooth(0.45, 1.0, Math.abs(x)) * smooth(0.5, -0.2, z));
  },
}));
headRoot.add(fur({ scale: [0.2, 0.12, 0.17], pos: [0, 0.4, 0.14], rot: [-0.3, 0, 0], len: 0.1, dens: 50, droop: 0.01, color: () => mix3(C.cream, C.apricot, 0.5) }));
for (const s of [-1, 1]) {
  headRoot.add(fur({ scale: [0.2, 0.2, 0.2], pos: [s * 0.34, -0.12, 0.26], len: 0.12, dens: 45, droop: 0.03, color: () => C.white }));
  const patch = ell(std(0x2a140c, 0.9), [0.1, 0.085, 0.05], [s * 0.185, 0.07, 0.43]); headRoot.add(patch);
}
headRoot.add(fur({ scale: [0.27, 0.2, 0.3], pos: [0, -0.1, 0.3], len: 0.08, dens: 55, droop: 0.01, color: () => C.white }));

const eyes = [];
const eyeMat = std(0x1b0b07, 0.08, 0.2);
const hiMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

}

}

  actBtn.disabled = false; actBtn.textContent = 'Again';

/* mic blowing: asked only when this button is pressed */
async function startMic() {
  if (S.mic) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    S.mic = { stream, ac, an, buf: new Uint8Array(an.fftSize), hot: 0 };
    micBtn.textContent = 'Listening. Blow now';
    live.textContent = 'Listening for a blow.';
  } catch (e) { micBtn.hidden = true; setLede(CONFIG.copy.nomic); }
}
function stopMic() {
  if (!S.mic) return;
  S.mic.stream.getTracks().forEach((t) => t.stop()); S.mic.ac.close?.(); S.mic = null;
  micBtn.textContent = 'Or blow into the mic';
}
micBtn.addEventListener('click', startMic);
function pollMic(dt) {
  const m = S.mic; if (!m || S.mode !== 'wished') return;
  m.an.getByteTimeDomainData(m.buf);
  let sum = 0; for (let i = 0; i < m.buf.length; i++) { const v = (m.buf[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / m.buf.length);
  m.hot = rms > 0.18 ? m.hot + dt : Math.max(0, m.hot - dt);
  if (m.hot > 0.25) blow();
}

function orbitAt(a, out) {
  const c = L.dogBase;
  return out.set(c.x + Math.cos(a) * L.orbit[0], c.y + 0.35 + Math.sin(a * 2) * 0.18, c.z + 0.2 + Math.sin(a) * L.orbit[1] * 1.1);
}
let time = 0;
function update(dt) {
  time += dt; U.uTime.value = time;
  const mot = RM ? 0.25 : 1;
  // pointer smoothing for tilt
  const px = pointer.has ? (pointer.x / W) * 2 - 1 : 0, py = pointer.has ? (pointer.y / H) * 2 - 1 : 0;
  pointer.sx = damp(pointer.sx, px, 4, dt); pointer.sy = damp(pointer.sy, py, 4, dt);
  tilt.y = damp(tilt.y, pointer.sx * CONFIG.tiltY * mot, 5, dt);
  tilt.x = damp(tilt.x, pointer.sy * CONFIG.tiltX * mot, 5, dt);

  // dog placement
  const bob = Math.sin(time * 0.9) * CONFIG.floatAmp * mot;
  let jy = S.jumpY.step(dt, 0); if (jy < 0) { jy = 0; S.jumpY.x = 0; if (S.jumpY.v < 0) S.jumpY.v *= -0.2; }
  S.jumpY.x = jy;
  // jump uses gravity-ish spring toward 0; add extra gravity feel
  S.jumpPending = S.jumpPending.map((t) => t - dt).filter((t) => { if (t <= 0) { jump(3.6); return false; } return true; });
  S.celebrateT = S.celebrateT >= 0 ? S.celebrateT + dt : -1;
  const lunge = S.plush === 'fetching' || S.plush === 'carrying';
  S.dogOff.x = damp(S.dogOff.x, S.plush === 'fetching' ? clamp((plush.position.x - L.dogBase.x) * 0.55, -L.halfW * 0.4, L.halfW * 0.4) : 0, 5, dt);
  S.dogOff.y = damp(S.dogOff.y, S.plush === 'fetching' ? clamp((plush.position.y - L.dogBase.y) * 0.5, -L.halfH * 0.3, L.halfH * 0.3) : 0, 5, dt);
  dogHolder.position.set(L.dogBase.x + S.dogOff.x, L.dogBase.y + S.dogOff.y + bob + jy * 0.35, L.dogBase.z);
  dog.rotation.y = -0.35 + tilt.y + clamp(S.dogOff.x * 0.25, -0.35, 0.35);
  dog.rotation.x = tilt.x * 0.8 - 0.05 - jy * 0.05;
  dog.rotation.z = -S.dogOff.x * 0.05;
  // breathing and squash
  const br = Math.sin(time * 2.1) * 0.012 * mot;
  const sq = clamp(S.jumpY.v * 0.012, -0.05, 0.07);
  bodyG.scale.set(1 + br * 0.5 - sq * 0.6, 1 + br + sq, 1 + br * 0.5 - sq * 0.6);
  headP.position.y = 0.36 + br * 1.5;

  // look target
  dogHolder.updateMatrixWorld(true);
  let look = null;
  if (S.plush === 'held' || S.plush === 'flying' || S.plush === 'fetching') look = tgt.copy(plush.position).setZ(plush.position.z + 1.5);
  else if (S.lookAtCake > 0.5) look = cake.position;
  else if (pointer.has) look = pointerWorld(L.dogBase.z + 1.6, tgt);
  else { tgt.set(L.dogBase.x + Math.sin(time * 0.5) * 0.8, L.dogBase.y + 0.6, 3); look = tgt; }
  loc.copy(look); dog.worldToLocal(loc); loc.sub(headP.position);
  const wantYaw = clamp(Math.atan2(loc.x, loc.z), -0.65, 0.65);
  const wantPitch = clamp(-Math.atan2(loc.y, Math.hypot(loc.x, loc.z)) - 0.1, -0.5, 0.4);
  const prevYaw = S.headYaw;
  S.headYaw = damp(S.headYaw, wantYaw, 7, dt); S.headPitch = damp(S.headPitch, wantPitch, 7, dt);
  // hover tilt
  const hov = pointer.has && !pointer.down && S.plush !== 'held' && pick(dogHit);
  S.hoverDog = hov;
  const wantRoll = hov ? 0.34 * (Math.sin(time * 0.7) > -2 ? 1 : 1) : 0;
  S.headRoll = damp(S.headRoll, wantRoll, 6, dt);
  headP.rotation.set(S.headPitch + (hov ? -0.08 : 0), S.headYaw, S.headRoll, 'YXZ');
  const yawVel = (S.headYaw - prevYaw) / Math.max(dt, 0.001);
  // eyes: tiny extra gaze offset + blink
  S.blinkT -= dt; if (S.blinkT < 0) { S.blink = 0.14; S.blinkT = rand(2.2, 5.5); }
  S.blink = Math.max(0, S.blink - dt);
  const bl = S.blink > 0 ? 0.08 : 1;
  eyes.forEach((e) => { e.scale.y = damp(e.scale.y, bl, 40, dt); });

  // jaw, tongue, bark
  S.barkT = Math.max(0, S.barkT - dt);
  const barking = S.barkT > 0 ? Math.abs(Math.sin(time * 22)) : 0;
  const pant = (Math.sin(time * 6) * 0.5 + 0.5) * (S.celebrateT >= 0 && S.celebrateT < 5 ? 0.5 : 0.15) * mot;
  const jawOpen = 0.3 + pant * 0.2 + barking * 0.4;
  jaw.rotation.x = jawOpen;
  tongue.position.set(0, -0.005 - jawOpen * 0.05, 0.08 + pant * 0.04 + barking * 0.03);
  tongue.scale.set(0.08, 0.035, 0.12 + pant * 0.05);
  tongue.rotation.x = -0.15 + Math.sin(time * 5) * 0.06 * mot;

  // ears: spring lag from head turn and jumping
  for (const e of ears) {
    const tz = e.side * 0.12 - yawVel * 0.025 * e.side * 0 + (-yawVel * 0.035) - S.jumpY.v * 0.03 * e.side * 0.0;
    e.piv.rotation.z = e.sx.step(dt, e.side * 0.14 + clamp(-yawVel * 0.03, -0.5, 0.5) + e.side * clamp(S.jumpY.v * 0.04, -0.4, 0.4));
    e.piv.rotation.x = e.sz.step(dt, clamp(-S.jumpY.v * 0.05, -0.5, 0.5) + Math.sin(time * 1.4 + e.side) * 0.03 * mot);
    void tz;
  }
  // tail
  S.wagBoost = Math.max(0, S.wagBoost - dt * 0.5);
  const amp = (S.wag + S.wagBoost) * mot, f = 7 + S.wagBoost * 4;
  tailBase.rotation.z = Math.sin(time * f) * amp * 0.45;
  tailSegs.forEach((g, i) => { g.rotation.x = 0.36; g.rotation.z = Math.sin(time * f - i * 0.7) * amp * 0.22 * (i > 0 ? 1 : 0); });

  // candles
  let lit = 0;
  candles.forEach((c) => {
    c.lit = damp(c.lit, c.target, c.target ? 9 : 14, dt);
    const flick = 1 + Math.sin(time * 17 + c.ph) * 0.1 + Math.sin(time * 29 + c.ph * 2) * 0.06;
    const s = Math.max(0.0001, c.lit * flick);
    c.fl.scale.set(s, s * (1 + 0.1 * Math.sin(time * 11 + c.ph)), s);
    lit += c.lit;
  });
  cake.position.set(L.cakeBase.x, L.cakeBase.y + Math.sin(time * 0.8 + 1) * 0.06 * mot, L.cakeBase.z);
  cakeInner.rotation.y = time * 0.25 * mot + tilt.y * 0.4;
  cake.rotation.x = 0.28 + tilt.x * 0.5; cake.rotation.z = Math.sin(time * 0.6) * 0.03 * mot;
  cake.updateMatrixWorld(true);
  // candle light
  const frac = lit / CONFIG.candleCount;
  candleL.position.copy(cakeTopWorld(tmpV)); candleL.position.y += 0.15;
  candleL.intensity = frac * (2.2 + Math.sin(time * 13) * 0.25);
  U.uCandle.value.copy(candleL.position).applyMatrix4(camera.matrixWorldInverse);
  U.uCandleI.value = frac * 2.6;
  // smoke
  smoke.forEach((s) => {
    if (s.t > 2) return; s.t += dt;
    s.m.position.set(s.base.x + Math.sin(s.t * 6) * 0.03, s.base.y + s.t * 0.5, s.base.z);
    s.m.scale.setScalar(1 + s.t * 3); s.m.material.opacity = Math.max(0, 0.5 * (1 - s.t / 1.4));
    if (s.t > 1.4) s.m.visible = false;
  });
  // wish star
  if (S.wish) {
    const w = S.wish; w.t += dt;
    if (!w.m) { w.m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshBasicMaterial({ color: new THREE.Color(CONFIG.accent) })); world.add(w.m); w.trail = []; }
    const u = w.t / 1.8;
    w.m.position.set(w.p.x + Math.sin(u * 5) * 0.15, w.p.y + u * u * 4.5 + u * 1.2, w.p.z + u * 1.2);
    w.m.scale.setScalar(Math.max(0.0001, 1 - Math.max(0, u - 0.7) * 3.3));
    if (u > 1.0) { world.remove(w.m); S.wish = null; if (!RM) addStar(true); }
  }

  updatePlush(dt, mot);
  updateScraps(dt);

  // bubble
  if (bubbleT > 0) {
    bubbleT -= dt; if (bubbleT <= 0) bubble.classList.remove('on');
    mouthA.getWorldPosition(bubbleHead);
    const v = bubbleHead.clone().project(camera);
    const bx = (v.x * 0.5 + 0.5) * W + 26, by = (-v.y * 0.5 + 0.5) * H - 54;
    const bw = bubble.offsetWidth;
    bubble.style.transform = `translate3d(${clamp(bx, 12, W - bw - 12)}px, ${clamp(by, 56, H - 60)}px, 0)`;
  }
  pollMic(dt);
}

function updatePlush(dt, mot) {
  const P = plush.position;
  S.orbitA += dt * CONFIG.orbitSpeed * (RM ? 0.1 : 1);
  const bobY = Math.sin(time * 1.6) * 0.08 * mot;
  if (S.plush === 'orbit') {
    orbitAt(S.orbitA, orbitPos); orbitPos.y += bobY;
    if (S.orbitBlend < 1) {
      S.orbitBlend = Math.min(1, S.orbitBlend + dt * 0.9); const e = S.orbitBlend * S.orbitBlend * (3 - 2 * S.orbitBlend);
      P.lerpVectors(S.dropFrom, orbitPos, e);
    } else P.copy(orbitPos);
    plushInner.rotation.y += dt * 0.6 * mot; plushInner.rotation.x = damp(plushInner.rotation.x, Math.sin(time) * 0.2, 4, dt); plushInner.rotation.z = damp(plushInner.rotation.z, 0.1, 4, dt);
  } else if (S.plush === 'held') {
    pointerWorld(L.dogBase.z + 0.9, pw);
    P.lerp(pw, 1 - Math.exp(-22 * dt));
    plushInner.rotation.x = damp(plushInner.rotation.x, 0, 8, dt); plushInner.rotation.z = damp(plushInner.rotation.z, Math.sin(time * 6) * 0.15, 8, dt);
    // fed: dropped on the dog's mouth is handled at release by proximity in flying
  } else if (S.plush === 'flying') {
    S.plushT += dt;
    P.addScaledVector(S.plushVel, dt); S.plushVel.multiplyScalar(Math.exp(-1.0 * dt));
    P.z = damp(P.z, L.dogBase.z + 0.6, 3, dt);
    const bx = L.halfW * 0.92, by = L.halfH * 0.85;
    if (Math.abs(P.x) > bx) { P.x = Math.sign(P.x) * bx; S.plushVel.x *= -0.6; }
    if (P.y > by) { P.y = by; S.plushVel.y *= -0.6; } if (P.y < -by) { P.y = -by; S.plushVel.y *= -0.6; }
    plushInner.rotation.x += S.spin.x * dt * Math.min(1, S.plushVel.length() * 0.4 + 0.2);
    plushInner.rotation.y += S.spin.y * dt * Math.min(1, S.plushVel.length() * 0.4 + 0.2);
    plushInner.rotation.z += S.spin.z * dt * Math.min(1, S.plushVel.length() * 0.4 + 0.2);
    mouthA.getWorldPosition(mouthW);
    if (P.distanceTo(mouthW) < 0.7) catchPlush();
    else if (S.plushT > 0.9 && S.plushVel.length() < 1.2 || S.plushT > 2.2) { S.plush = 'fetching'; S.plushT = 0; say('on it.', 1000); }
  } else if (S.plush === 'fetching') {
    S.plushT += dt;
    plushInner.rotation.x = damp(plushInner.rotation.x, 0, 3, dt);
    mouthA.getWorldPosition(mouthW);
    if (S.plushT > 0.9) P.lerp(mouthW, 1 - Math.exp(-2.2 * dt));
    if (P.distanceTo(mouthW) < 0.5 || S.plushT > 3) catchPlush();
  } else if (S.plush === 'carrying') {
    S.carryT += dt;
    mouthA.getWorldPosition(mouthW);
    P.copy(mouthW); P.y -= 0.09; P.z += 0.1;
    plushInner.rotation.set(0.4, Math.PI * 0.5 + headP.rotation.y, 0.2 + Math.sin(time * 8) * 0.1 * mot);
    if (S.carryT > 1.5 && S.dogOff.length() < 0.15) {
      S.plush = 'orbit'; S.dropFrom.copy(P); S.orbitBlend = 0; S.wagBoost = 1.2; jump(2.8); say('drop it. (dropped it.)', 1500);
    }
  }
  plush.rotation.set(0, 0, 0);
  const ps = S.plush === 'held' ? 1.12 : 1; plush.scale.setScalar(damp(plush.scale.x, ps, 10, dt));
}
function catchPlush() {
  S.plush = 'carrying'; S.carryT = 0; S.wagBoost = 1.6; jump(2.4);
  say('got it.', 900);
}

/* ---------- loop ---------- */
let raf = 0, fAvg = 16, slowFrames = 0;
function frame(ts) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - clock.last) / 1000 || 0.016); clock.last = ts;
  update(dt);
  drawDots(); drawStars(dt);
  renderer.render(scene, camera);
  // governor: lower pixel ratio, then shell count, if frames stay slow
  fAvg = lerp(fAvg, dt * 1000, 0.05);
  if (fAvg > 26) { if (++slowFrames > 90) { slowFrames = 0; fAvg = 16; if (dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); layout(); } else if (activeShells > 9) setShells(Math.max(9, activeShells - 4)); } }
  else slowFrames = 0;
}
function start() { if (!raf) { clock.last = performance.now(); raf = requestAnimationFrame(frame); } }
function stop() { cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
addEventListener('resize', layout);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.mic) stopMic(); });
layout();
if (location.search.includes('debug')) window.__card = { plush, dog, headP, tgt, loc, L, camera, S, say, celebrate, blow, igniteAll, CONFIG, setShells };
start();
</script>
