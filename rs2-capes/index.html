<style>
@font-face { font-family: 'Jersey 10'; font-style: normal; font-weight: 400; font-display: swap; src: url(../shared/fonts/jersey-10-latin.woff2) format('woff2'); }
/* Layout: one full-bleed void. Capes float as DOM objects with stacked SVG layers (real Z depth).
   UI is a single quiet picker top-right and a caption bottom-centre. Single dark look by choice. */
:root {
  color-scheme: dark;
  --void: #04050a;
  --void-lift: #0a0d17;
  --ink: #dde1ee;
  --dim: #7a8196;
  --line: rgba(255, 255, 255, 0.13);
  --panel: rgba(9, 11, 19, 0.82);
  --accent: #9db4ff;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --osrs: 'Jersey 10', 'Pixelify Sans', ui-monospace, Menlo, Consolas, monospace;
  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font: 12px/1.4 var(--mono);
  overflow: hidden;
}
#stage {
  view-transition-name: lab-art;
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(ellipse 80% 70% at 50% 42%, var(--void-lift) 0%, var(--void) 72%);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#dots, #stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.cape {
  --lx: 0;
  position: absolute;
  left: 0; top: 0;
  transform-origin: 50% 50%;
  opacity: 0;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.cape.off { pointer-events: none; }
.is-focus .cape.front { cursor: default; }
.cape:focus-visible .tilt { filter: drop-shadow(0 0 2px #fff); }
.glow {
  position: absolute;
  left: -45%; top: -15%;
  width: 190%; height: 130%;
  border-radius: 50%;
  background: radial-gradient(closest-side, var(--g0) 0%, var(--g1) 45%, rgba(0,0,0,0) 100%);
  opacity: 0;
  pointer-events: none;
}
.tilt {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  pointer-events: none;
}
.layer {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  overflow: visible;
  transform: translateZ(calc(var(--z) * var(--u)));
  pointer-events: none;
}
.sheen {
  position: absolute;
  inset: 0;
  transform: translateZ(calc(1.3 * var(--u)));
  -webkit-mask: var(--cape-mask) 0 0 / 100% 100% no-repeat;
  mask: var(--cape-mask) 0 0 / 100% 100% no-repeat;
  background: radial-gradient(circle at var(--sx, 50%) var(--sy, 30%), rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 58%);
  pointer-events: none;
}

/* in-game style title: pixel face at 2x its 10px grid, OSRS interface orange, hard 1-grid-unit black shadow */
.brand {
  position: fixed;
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 20;
  margin: 0;
  max-width: calc(100vw - 32px);
  font: 400 20px/1.05 var(--osrs);
  letter-spacing: 0.02em;
  color: #ff981f;
  text-shadow: 2px 2px 0 #000;
  text-rendering: optimizeSpeed;
  -webkit-font-smoothing: none;
  pointer-events: none;
}

/* smooth hand-off with the landing page (card art <-> stage) */
@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; }
::view-transition-group(lab-art) { animation-duration: .5s; animation-timing-function: cubic-bezier(.2,.7,.2,1); }

/* back to labs index */
.back {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 16px);
  z-index: 50;
  font: 400 11px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
  text-decoration: none;
  padding: 9px 12px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  background: rgba(10,10,14,0.55);
  transition: color .2s, border-color .2s;
}
.back:hover, .back:focus-visible { color: var(--ink); border-color: rgba(255,255,255,0.35); outline: none; }
.caption {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  text-align: center;
  pointer-events: none;
  z-index: 20;
}
.hint, .name { transition: opacity 0.6s ease; }
.hint {
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.name {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  font: italic 400 32px/1.1 var(--serif);
  color: var(--ink);
  text-wrap: balance;
  opacity: 0;
}
.name small {
  display: block;
  margin-top: 6px;
  font: 400 11px/1 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.is-focus .name { opacity: 1; }
.is-focus .hint, .seen .hint, .empty .hint { opacity: 0; }

#picker {
  display: flex; gap: 8px; align-items: flex-start; justify-content: flex-end;
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: 16px;
  z-index: 50;
  font-family: var(--mono);
}
#pickerBtn, #trimBtn {
  font: 500 11px/1 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 13px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
#trimBtn[aria-pressed="true"] #trimState { color: var(--ink); }
#pickerBtn:hover, #trimBtn:hover, #pickerBtn[aria-expanded="true"] { color: var(--ink); border-color: rgba(255,255,255,0.3); }
#pickerBtn:focus-visible, #trimBtn:focus-visible, .row:focus-within, #allBtn:focus-visible, #noneBtn:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
#panel {
  position: absolute;
  right: 0; top: 40px;
  width: 220px;
  max-width: calc(100vw - 32px);
  padding: 8px;
  max-height: min(70vh, 460px); overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 34px;
  padding: 0 8px;
  border-radius: 6px;
  color: var(--ink);
  cursor: pointer;
}
.row:hover { background: rgba(255,255,255,0.05); }
.row input { accent-color: var(--accent); margin: 0; }
.sw {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 8px var(--c);
}
.panel-foot { position: sticky; bottom: -8px; background: var(--panel); margin: 0 -8px -8px; display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
#allBtn, #noneBtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.panel-foot .btns { display: flex; gap: 14px; }
@media (max-width: 480px) { .name { font-size: 26px; } }
@media (max-width: 640px) { .caption { bottom: calc(env(safe-area-inset-bottom, 0px) + 62px); } }
.flat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.cape.gone { display: none; }
.glow { will-change: opacity; }
</style>

<div id="picker">

    <div id="rows"></div>
    <div class="panel-foot"><span>Shown on the canvas</span><span class="btns"><button id="allBtn" type="button">All</button><button id="noneBtn" type="button">None</button></span></div>
  </div>

<script>
(() => {
'use strict';

/* ---------- tunables ---------- */
const CONFIG = {
  focusHeight: 0.82,      // focused cape height as a fraction of the viewport
  idleMaxHeight: 0.40,    // largest idle cape height as a fraction of the viewport
  tiltY: 25,              // max degrees left/right when focused
  tiltX: 15,              // max degrees up/down when focused
  tiltSmooth: 6,          // higher = snappier tilt
  drift: 0.025,
  capeStyle: { herblore: 'rs3' },   // per-cape art style: 'rs3' | 'osrs' (no UI yet)
  idleSpeed: 0.62,        // time scale for the idle float; lower = slower           // idle drift amplitude, fraction of idle cape height
  spring: { k: 70, c: 13 },
  blurPx: 14,             // visual blur on the background capes while one is focused
  dimOpacity: 0.4,
  glowIdle: 0.38,
  crowdAt: 10,            // more capes than this shown at once = crowded: no per-cape blur, no glow pulse, no idle tilt (keeps big walls of capes smooth)
  glowHover: 0.6,
  hoverScale: 1.06,       // idle cape grows this much under the pointer
  gyroRange: 30,          // degrees of phone tilt that reach full cape tilt (mobile, while a cape is focused)
  glowFocus: 0.8,
  starGap: [6, 15],       // seconds between shooting stars
  defaultShown: 'all',   // capes shown on first visit: 'all', or a list of ids
  storageKey: 'cape-void:shown:v2'
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// coarse pointer, few cores or little memory: build a lighter 3D stack. A frame-rate governor can also drop effects at runtime.
const LOWPOWER = matchMedia('(pointer: coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
let lite = false, crowded = false;

/* ---------- colour helpers ---------- */
const hex2rgb = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const rgb2hex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const shade = (h, a) => { const t = a < 0 ? 0 : 255, p = Math.abs(a); return rgb2hex(hex2rgb(h).map(v => v + (t - v) * p)); };
const rgba = (h, a) => { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; };

/* ---------- cape geometry (viewBox 120 x 260, flat-shaded low poly) ---------- */
// OUT = outer trim silhouette, MID = inner trim band edge, INN = body panel. Hem is a shallow point with chamfered corners,
// so the side trim runs straight down and ends flush with the hem (no band across the bottom).
const OUT = '32,22 88,22 110,236 60,256 10,236';
const MID = '36,22 84,22 104,238.4 60,256 16,238.4';
const INN = '40,22 80,22 98,240.8 60,256 22,240.8';
// back plate hangs a few units below the body's hem so the trim colour pokes out at the bottom
const OUTB = '32,22 88,22 110.4,239.5 60,259.5 9.6,239.5';
const MIDB = '36,22 84,22 104.3,241.9 60,259.5 15.7,241.9';
const COLLAR = '29,24 34,21 60,29 86,21 91,24 92,50 60,82 28,50';
const PAD = { edge: '1,6 5,4.5 29.5,37 28,41', face: '5,4.5 14,1 33,28 29.5,37', thick: '14,1 17.5,3 36,30 33,28' };
const stripTop = i => 40 + i * (40 / 6);
const stripBot = i => 14 + i * (92 / 6);
const stripX = (i, y) => stripTop(i) + (stripBot(i) - stripTop(i)) * (y - 22) / 228;
const LIGHT = 0.15;
// organic section boundaries: the straight line plus a gentle S-curve per boundary (outer edges stay straight)
const WOB = [0, 2.3, -2.0, 2.6, -2.2, 1.9, 0];
const bx = (i, y) => stripX(i, y) + WOB[i] * (0.35 + 0.65 * (y - 22) / 228) * Math.sin((y - 22) / 228 * Math.PI * (1.6 + 0.25 * i) + i * 1.7);
const bline = (i, dx = 0) => Array.from({ length: 25 }, (_, k) => { const y = 22 + 240 * k / 24; return `${(bx(i, y) + dx).toFixed(2)},${y.toFixed(1)}`; }); // how strongly the lit-to-shaded gradient shows across the body
// white and black overlays whose opacity follows a CSS expression; only one of them is ever visible
const ov = (pts, e) => `<polygon points="${pts}" fill="#fff" style="opacity:max(0,calc(${e}))"/><polygon points="${pts}" fill="#000" style="opacity:max(0,calc(-1 * (${e})))"/>`;

/* emblems, centred around (60,135) */
function emHerbRs3() {
  const leaf = (a, c) => `<g transform="rotate(${a} 60 162)"><polygon points="60,162 53,144 60,120 67,144" fill="${c}"/><polygon points="60,162 60,120 67,144" fill="rgba(0,0,0,.2)"/></g>`;
  return leaf(-45, '#4fb862') + leaf(45, '#4fb862') + leaf(-22, '#76d882') + leaf(22, '#76d882') + leaf(0, '#9af0a2');
}
function emHerbOsrs() {
  // traced from the OSRS item sprite (px coords), mapped to cape units around (60,128)
  const T = pts => pts.map(([x, y]) => `${(60 + (x - 215) * 0.24).toFixed(1)},${(130 + (y - 410) * 0.24).toFixed(1)}`).join(' ');
  const P = (pts, fill) => `<polygon points="${T(pts)}" fill="${fill}"/>`;
  const outline = [[215,303],[233,340],[256,346],[288,350],[295,378],[312,372],[314,432],[278,492],[215,516],[152,492],[116,432],[118,372],[135,378],[142,350],[174,346],[197,340]];
  return P(outline, '#3a3126') +
    P([[152,352],[182,356],[186,384],[158,378]], '#16a550') + P([[278,352],[248,356],[244,384],[272,378]], '#16a550') +
    P([[125,385],[172,396],[215,430],[190,448],[140,432]], '#2fbf5d') + P([[140,432],[190,448],[215,430],[212,498],[152,480],[128,440]], '#16a14e') +
    P([[305,385],[258,396],[215,430],[240,448],[290,432]], '#2fbf5d') + P([[290,432],[240,448],[215,430],[218,498],[278,480],[302,440]], '#12994a') +
    P([[215,318],[236,392],[241,432],[215,502],[189,432],[194,392]], '#0e8f20') + P([[215,318],[236,392],[241,432],[215,502]], '#0a7a18');
}
function emMine() {
  return `<g transform="translate(5,12) rotate(-35 60 122)">
    <rect x="57" y="92" width="6" height="62" fill="#a9742a"/><rect x="57" y="92" width="2.5" height="62" fill="#cf9a46"/>
    <polygon points="28,98 60,88 92,98 86,105 60,97 34,105" fill="#d7dbde"/>
    <polygon points="34,105 60,97 86,105 60,101" fill="#8b9197"/></g>`;
}
function emCook(u = '') {
  const k = '#16110f';
  // smoke wisps: a base segment plus a tip segment bent at a "finger joint". All outlines are drawn first (dilated dark copies),
  // then all fills, so neighbouring wisps share one continuous outline.
  const wisp = (x, yb, hb, ht, lean, bend, w = 2.9) => {
    const yj = yb - hb;
    const base = `<polygon points="${x - w},${yb} ${x - w},${yj} ${x + w},${yj} ${x + w},${yb}"/><circle cx="${x}" cy="${yj}" r="${w}"/>`;
    const tip = `<polygon points="${x - w},${yj} ${x - w},${yj - ht + 1.5} ${x - w + 1.2},${yj - ht} ${x + w - 1.2},${yj - ht} ${x + w},${yj - ht + 1.5} ${x + w},${yj}"/>`;
    return st => `<g transform="rotate(${lean} ${x} ${yb})" ${st}>${base}<g transform="rotate(${bend} ${x} ${yj})">${tip}</g></g>`;
  };
  const wisps = [wisp(51, 111, 8, 6, -12, -24), wisp(60, 111, 6, 5, 7, -26), wisp(69, 111, 8, 6, 12, 24)];
  const smoke = wisps.map(w => w(`fill="${k}" stroke="${k}" stroke-width="5.2" stroke-linejoin="round"`)).join('') + wisps.map(w => w('fill="#d9d4da"')).join('');
  const pot = '44,109 76,109 72,116 69,121 82,127 85,138 78,149 66,153 46,152 37,146 34,137 37,128 50,121 47,116';
  // radial shading (lit upper-left, shaded lower-right) makes the pot read as round; the outline is drawn last so it runs unbroken all the way round
  return `<g transform="translate(60 131) scale(.88) translate(-60 -131)">
    <defs><radialGradient id="pot-shade-${u}" cx=".36" cy=".34" r=".78">
      <stop offset="0" stop-color="#bdb36a"/><stop offset=".45" stop-color="#8f8744"/><stop offset=".8" stop-color="#6a6538"/><stop offset="1" stop-color="#4f4b2b"/>
    </radialGradient></defs>
    ${smoke}
    <polygon points="${pot}" fill="url(#pot-shade-${u})"/>
    <ellipse cx="46" cy="133" rx="5" ry="8" fill="#fff" opacity=".13" transform="rotate(25 46 133)"/>
    <polygon points="44,109 76,109 75,112.5 45,112.5" fill="#b8ae66"/>
    <polygon points="${pot}" fill="none" stroke="${k}" stroke-width="2.6" stroke-linejoin="round"/>
  </g>`;
}
function emMagic() {
  return `<circle cx="62" cy="136" r="21" fill="#f1b928"/>
    <polygon points="58,108 67,112 77,140 49,142 46,131 39,129 52,120" fill="#1b2aa5"/>
    <polygon points="58,108 52,120 39,129 46,131 49,142 62,141 60,120" fill="#2c3dc0"/>
    <polygon points="67,112 77,140 62,141 60,120" fill="#121c85"/>
    <polygon points="35,150 50,147 76,147 90,152 86,161 52,169 40,160" fill="#1b2aa5"/>
    <polygon points="35,150 50,147 76,147 90,152 60,155" fill="#2c3dc0"/>
    <polygon points="50,138 75,139 76,147 50,147" fill="#8a5b2a"/>
    <rect x="61" y="139" width="6" height="8" fill="#e8e22a"/>`;
}

/* The eight capes below were traced from the OSRS Wiki's 3D cape renders (reference only): each emblem is the render's flat colours,
   outlined and simplified to low-poly paths, centred on (60,135). Palettes are the render's colours lifted to match the first four. */
function emAgility() {
  return `<g fill-rule="evenodd" stroke-width=".3" stroke-linejoin="round"><path d="M56.8,104.0 63.4,104.3 64.8,106.9 64.8,110.9 63.2,115.1 56.6,114.9 55.2,110.9 55.2,107.2ZM49.4,162.3 44.4,166.0 37.7,163.1 48.6,155.4 52.1,152.0 55.2,138.2 55.2,121.8 50.5,127.8 52.1,137.4 47.3,137.4 44.1,123.1 52.1,116.7 66.4,116.7 71.4,121.8 74.0,126.3 75.1,126.3 81.7,123.3 82.3,123.6 82.3,128.1 72.5,131.0 69.3,127.8 64.8,121.8 64.8,133.1 63.2,137.1 63.2,137.6 79.1,145.3 79.1,155.1 68.2,166.0 67.7,166.0 64.8,161.2 72.7,152.0 72.7,148.5 61.6,145.6 60.0,153.5 55.0,158.6Z" fill="#9b8f7b" stroke="#9b8f7b"/></g>`;
}
function emThieving() {
  return `<g fill-rule="evenodd" stroke-width=".3" stroke-linejoin="round"><path d="M83.7,140.3 79.5,144.5 69.5,145.9 66.1,149.5 62.0,150.9 60.3,150.9 56.1,149.5 52.7,145.9 42.7,144.5 37.4,139.2 36.0,137.0 36.3,129.7 37.7,125.8 47.7,120.8 52.7,119.1 69.5,119.1 74.5,120.8 82.9,125.0 84.0,137.5ZM43.0,130.8 41.0,134.2 42.7,137.8 53.9,139.2 56.4,139.2 57.8,137.8 54.4,127.5 44.4,127.5ZM64.5,137.2 65.9,139.2 79.5,137.8 81.2,134.7 79.5,131.1 77.9,127.5 67.8,127.5Z" fill="#342c22" stroke="#342c22"/></g>`;

// frame-rate governor: if ~3s of frames average slower than ~38fps, drop the costly extras (blur, shooting stars, glow pulse) for good
function goLite() {
  lite = true; CONFIG.blurPx = 0; CONFIG.dimOpacity = Math.min(CONFIG.dimOpacity, 0.3);
  stars.length = 0; ctx.clearRect(0, 0, vw, vh);
  document.body.classList.add('lite');
}

function frame(ts) {
  if (!T0) { T0 = ts; last = ts; }
  if (prevTs) {
    fpsSum += ts - prevTs;
    if (++fpsN === 90) { slow = fpsSum / 90 > 26 ? slow + 1 : 0; fpsSum = fpsN = 0; if (slow >= 2 && !lite) goLite(); }
  }
  prevTs = ts;
  const t = (ts - T0) / 1000;
  const dt = Math.min((ts - last) / 1000, 1 / 30) || 1 / 60;
  last = ts;
  const f = state.focus;
  const amp = reduce ? 0 : CONFIG.drift;
  const ti = t * CONFIG.idleSpeed;

  for (const c of capes) {
    if (c.gone) continue;          // fully faded out / never shown: no work, no layers (display:none)
    const isF = c === f;
    const p = c.ph;
    if (t < c.born) continue;

    // targets
    let tx, ty, ts_, tr;
    if (isF) {
      tx = vw / 2; ty = vh * 0.46 + (reduce ? 0 : Math.sin(t * 0.6 + p[0]) * 4); ts_ = 1; tr = 0;
    } else if (!c.enabled) {
      // leaving: mirror of the intro (sink a little, shrink to 60%, turn slightly) while fading out
      tx = c.home.x; ty = c.home.y + vh * 0.16; ts_ = c.home.s * 0.6; tr = c.exitR || 0;
    } else {
      const a = (c.idleH || 200) * amp;
      tx = c.home.x + a * (Math.sin(ti * 0.23 + p[0]) + 0.6 * Math.sin(ti * 0.41 + p[1]));
      ty = c.home.y + a * 1.1 * (Math.sin(ti * 0.19 + p[2]) + 0.6 * Math.sin(ti * 0.37 + p[3]));
      ts_ = c.home.s * (1 + (reduce ? 0 : 0.01 * Math.sin(ti * 0.21 + p[4]))) * (c.hover && !f ? CONFIG.hoverScale : 1);
      tr = reduce ? 0 : 1.2 * Math.sin(ti * 0.17 + p[5]) + 0.6 * Math.sin(ti * 0.31 + p[6]);
    }
    spr(c, 'x', tx, dt); spr(c, 'y', ty, dt); spr(c, 's', ts_, dt); spr(c, 'r', tr, dt);

    // blur / dim
    c.mix += ((f && !isF ? 1 : 0) - c.mix) * ease(6, dt);
    const opTarget = !c.enabled ? 0 : (isF ? 1 : 1 - (1 - (crowded ? Math.min(CONFIG.dimOpacity, 0.3) : CONFIG.dimOpacity)) * c.mix);
    c.op += (opTarget - c.op) * ease(c.enabled ? 3.2 : 10, dt);
    if (!c.enabled && c.op < 0.004) { c.gone = true; c.el.classList.add('gone'); setMode(c, 'flat'); dropStack(c); dropFlat(c); continue; }
    const sc = Math.max(c.s, 0.05);

    // tilt
    let ryT, rxT;
    if (isF) {
      const g = performance.now() - gyro.last < 500;   // phone motion wins over touch while it is reporting
      ryT = (g ? gyro.nx : mouse.nx) * CONFIG.tiltY; rxT = -(g ? gyro.ny : mouse.ny) * CONFIG.tiltX;
    }
    else if (reduce || crowded) { ryT = 0; rxT = 0; }
    else { ryT = 3.5 * Math.sin(ti * 0.5 + p[7]); rxT = 1.2 * Math.sin(ti * 0.37 + p[1]); }
    const te = ease(isF ? CONFIG.tiltSmooth : 3, dt);
    c.ry += (ryT - c.ry) * te; c.rx += (rxT - c.rx) * te;

    // glow (style writes are skipped when the value hasn't changed)
    const gBase = isF ? CONFIG.glowFocus : (c.hover && !f ? CONFIG.glowHover : CONFIG.glowIdle);
    const pulse = (reduce || lite || crowded) ? 1 : 1 + 0.22 * Math.sin(t * 0.6 + p[2] * 2);
    const go = (gBase * pulse).toFixed(2);
    if (go !== c.go) { c.go = go; c.glowEl.style.opacity = go; }
    const gt = `translate(${(-c.ry * 0.5).toFixed(1)}px,${(c.rx * 0.5).toFixed(1)}px)`;
    if (gt !== c.gt) { c.gt = gt; c.glowEl.style.transform = gt; }

    // apply. --lx is quantised, so the shaded SVG only repaints on a visible change, not on every drift frame
    const el = c.el;
    const lxX = crowded && !isF ? c.home.x : c.x;   // crowded: light from the cape's resting place, so drifting does not restyle every cape every frame
    const lx = Math.round(Math.max(-1, Math.min(1, (lxX - vw / 2) / (vw * 0.38))) * 50) / 50;
    if (lx !== c.lx) { c.lx = lx; el.style.setProperty('--lx', lx); }
    el.style.transform = `translate(${(c.x - boxW / 2).toFixed(2)}px,${(c.y - focusH / 2).toFixed(2)}px) rotate(${c.r.toFixed(3)}deg) scale(${c.s.toFixed(4)})`;
    const os = c.op.toFixed(3);
    if (os !== c.os) { c.os = os; el.style.opacity = os; }
    const fs = c.mix > 0.01 && CONFIG.blurPx && !crowded ? `blur(${(CONFIG.blurPx * c.mix / sc).toFixed(2)}px)` : '';
    if (fs !== c.fs) { c.fs = fs; el.style.filter = fs; }
    const tf = `perspective(${c.persp}px) rotateX(${c.rx.toFixed(2)}deg) rotateY(${c.ry.toFixed(2)}deg)`;
    if (tf !== c.tf) { c.tf = tf; c.flatEl.style.transform = tf; }
    if (c.stackVisible && c.sheenEl) {
      c.tiltEl.style.transform = tf;
      c.sheenEl.style.setProperty('--sx', (50 + c.ry * 1.9).toFixed(1) + '%');
      c.sheenEl.style.setProperty('--sy', (32 - c.rx * 2.4).toFixed(1) + '%');
    }
  }

  // shooting stars
  if (!reduce && !lite) {
    if (t >= nextStar) { spawnStar(); nextStar = t + rnd(CONFIG.starGap[0], CONFIG.starGap[1]); }
    if (stars.length) { drawStars(dt); clearedStars = false; }
    else if (!clearedStars) { ctx.clearRect(0, 0, vw, vh); clearedStars = true; }
  }
  raf = requestAnimationFrame(frame);
}

// stop the loop entirely while the tab / app is in the background
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelAnimationFrame(raf);
  else { prevTs = 0; raf = requestAnimationFrame(frame); }
});

measure();
capes.forEach(seedIntro);
persist();
raf = requestAnimationFrame(frame);
})();
</script>
