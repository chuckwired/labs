<!--
  How this file is put together
  1. Plumbing: the registry and two hooks every engine calls.
  2. ENGINE sunset: log-spaced mesh pushed around by 16 Gerstner waves (vertex shader).
  3. ENGINE golden: a wave field baked once from a spectrum, sampled per pixel (fragment shader).
  4. Controller: the toggle, crossfade, persistence, and the ?fps readout.
  To keep one look: delete the other engine's <script>, its <canvas>, its button, and its entry
  in LOOKS in the controller. Nothing else refers to it.
-->

<script>
'use strict';
// 1. Plumbing
var ENGINES = {};            // name -> factory, run lazily the first time that look is shown
window.__oceans = {};        // name -> debug handle each engine sets (config, step, start, stop ...)
window.__oceanActive = null;
window.__oceanReady = function () {};   // engines call this after their first frame; the controller replaces it
window.__oceanFail = function (msg) {
  document.documentElement.classList.add('nogl');
  document.getElementById('nogl').textContent = msg || 'This ocean needs WebGL2.';
};
</script>

<script>
'use strict';
// 2. ENGINE sunset: swell mesh

ENGINES.sunset = () => {

// ---------------------------------------------------------------- CONFIG
const CONFIG = {
  sun: { elevationDeg: 1.0, azimuthDeg: 13, radiusDeg: 1.0, radiance: 95 },
  camera: { height: 3.7, horizonFrac: 0.44, fovYDeg: 46, minTanX: 0.42, heave: 0.25 },
  // [wavelength m, amplitude m, direction deg off the wind (0 = toward camera), steepness 0..1]
  waves: [
    [170, 0.50, -6, 0.040], [118, 0.28, 12, 0.050], [84, 0.22, -22, 0.060], [56, 0.17, 24, 0.090],
    [36, 0.16, -12, 0.121], [24, 0.105, 18, 0.143], [16, 0.068, -34, 0.165], [11, 0.042, 38, 0.187],
    [7.5, 0.027, -8, 0.209], [5.2, 0.018, 25, 0.220], [3.6, 0.012, -30, 0.231], [2.6, 0.008, 42, 0.242],
    [1.8, 0.0055, -48, 0.253], [1.25, 0.0038, 10, 0.264], [0.9, 0.0026, -60, 0.275], [0.65, 0.0018, 55, 0.275]
  ],
  windDirDeg: 0,
  amplitude: 1.0,        // global height multiplier
  steepness: 1.0,        // global crest-sharpness multiplier
  timeScale: 1.0,
  reducedMotionScale: 0.25,
  mesh: { cols: 224, rows: 352, near: 0.25, far: 8000 },
  look: { glitter: 1.0, detail: 0.55, foam: 1.0, sss: 0.5, exposure: 0.62, cirrusDrift: 0.0035 },
  penguin: {
    ndcX: -0.34,          // horizontal screen position (-1 left .. 1 right)
    ndcY: -0.17,          // vertical screen position (horizon is about +0.12, bottom -1)
    size: 1.0,            // model scale (model is ~0.5 m long)
    wander: 1.6,          // metres of slow drift around its spot
    lookEvery: [5, 13],   // seconds between head turns
    flipperEvery: [9, 24] // seconds between flipper twitches
  },
  quality: {
    dprCap: 1.75, scaleMin: 0.5, scaleMax: 1.0, scaleStartDesktop: 1.0, scaleStartMobile: 0.8,
    slowMs: 22, fastMs: 18.5, step: 0.07, settleMs: 1600, probeMs: 4500
  }
};

const canvas = document.getElementById('sea-sunset');
const ZOOM = new URLSearchParams(location.search).has('penguinzoom');
const params = new URLSearchParams(location.search);
const reduceMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;

// ---------------------------------------------------------------- GL setup
let gl = null;
try {
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: true, stencil: false,
                                     powerPreference: 'high-performance', preserveDrawingBuffer: false });
} catch (e) { gl = null; }
if (!gl) { document.documentElement.classList.add('nogl'); window.__oceans.sunset = { config: CONFIG, error: 'no webgl2' }; window.__oceanFail('This ocean needs WebGL2, which this browser is not offering.'); return; }

// ---------------------------------------------------------------- shaders
const COMMON = `#version 300 es
precision highp float;
uniform float u_t;
uniform vec3 u_sun;      // unit vector toward the sun
uniform vec3 u_sunCol;   // tint
uniform vec4 u_sunP;     // radiance, angular radius (rad), cloud offset xy
uniform vec4 u_cam;      // tanX, tanY, sinP, cosP
uniform float u_exp;
const float PI = 3.14159265;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 noised(vec2 x){
  vec2 i = floor(x), f = fract(x);
  vec2 u = f*f*f*(f*(f*6.-15.)+10.);
  vec2 du = 30.*f*f*(f*(f-2.)+1.);
  float a = hash12(i), b = hash12(i+vec2(1,0)), c = hash12(i+vec2(0,1)), d = hash12(i+vec2(1,1));
  float k1 = b-a, k2 = c-a, k4 = a-b-c+d;
  return vec3(a + k1*u.x + k2*u.y + k4*u.x*u.y, du*vec2(k1 + k4*u.y, k2 + k4*u.x));
}

vec3 ramp(float t){
  vec3 c0 = vec3(1.30,0.50,0.12), c1 = vec3(1.02,0.24,0.12), c2 = vec3(0.60,0.10,0.23),
       c3 = vec3(0.27,0.06,0.31), c4 = vec3(0.085,0.045,0.26), c5 = vec3(0.02,0.025,0.12);
  vec3 c = mix(c0, c1, smoothstep(0.0, 0.14, t));
  c = mix(c, c2, smoothstep(0.14, 0.30, t));
  c = mix(c, c3, smoothstep(0.30, 0.48, t));
  c = mix(c, c4, smoothstep(0.48, 0.72, t));
  return mix(c, c5, smoothstep(0.72, 1.0, t));
}

float cirrus(vec3 rd, float ang, int oct, out vec3 col){
  col = vec3(0.);
  float e = rd.y;
  if (e < 0.03) return 0.;
  vec2 uv = rd.xz / (e + 0.12);
  uv = mat2(0.95,-0.31,0.31,0.95) * uv + u_sunP.zw;
  vec2 q = vec2(uv.x * 0.42, uv.y * 3.4);
  float f = 0., a = 0.6;
  for (int i = 0; i < 4; i++){
    if (i >= oct) break;
    float n = noised(q).x; n = 1. - abs(2.*n - 1.); f += a * n * n;
    q = mat2(1.7,0.35,-0.35,1.7) * q; a *= 0.5;
  }
  float cover = noised(uv * vec2(0.16, 0.7) + 11.).x;
  float env = smoothstep(0.03, 0.12, e) * (1. - smoothstep(0.5, 0.95, e));
  float m = smoothstep(0.28, 0.82, f) * smoothstep(0.32, 0.68, cover) * env;
  float lit = exp(-e * 3.6) * (0.28 + 0.72 * exp(-ang * 1.1));
  col = mix(vec3(0.20,0.055,0.27), vec3(1.2,0.36,0.14), clamp(lit * 1.5, 0., 1.));
  return m;
}

vec3 skyCol(vec3 rd, int oct, bool bands){
  float e = max(rd.y, 0.0);
  float cs = dot(rd, u_sun);
  float ang = acos(clamp(cs, -1., 1.));
  vec3 c = ramp(sqrt(e));
  // anti-sun side is cooler and dimmer
  c *= mix(vec3(0.62,0.58,0.8), vec3(1.), smoothstep(-0.2, 0.9, cs));
  c += u_sunCol * (exp(-ang*2.6)*0.30 + exp(-ang*9.)*0.55 + exp(-ang*38.)*1.4) * (0.35 + 0.65*exp(-e*9.));
  // horizon haze: a bright thin film and a wider warm one
  float hz = exp(-e/0.010)*0.85 + exp(-e/0.055)*0.30;
  c += vec3(1.25,0.50,0.20) * hz * 0.7 * (0.45 + 0.9*exp(-ang*1.5));
  if (bands) {
    float az = atan(rd.x, -rd.z);
    for (int L = 0; L < 3; L++) {
      float fl = float(L);
      float ec = 0.030 + 0.036*fl;
      float n = noised(vec2(az*(7.+3.*fl), e*(300.-70.*fl) + fl*13.)).x * 0.65
              + noised(vec2(az*(21.+5.*fl)+7., e*(620.-100.*fl))).x * 0.35;
      float m = smoothstep(0.52, 0.80, n) * exp(-pow((e-ec)/(0.011+0.003*fl), 2.));
      float lit = exp(-ang*2.2) * (0.9 - 0.2*fl);
      vec3 bc = mix(vec3(0.17,0.04,0.16), vec3(1.15,0.36,0.14), clamp(lit,0.,1.));
      c = mix(c, bc, m * 0.7);
    }
  }
  vec3 cc; float cm = cirrus(rd, ang, oct, cc);
  c = mix(c, cc, cm * 0.7);
  return c;
}

vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0., 1.); }
vec3 finish(vec3 c, vec2 fc){
  c = aces(c * u_exp);
  c = pow(c, vec3(1./2.2));
  float n = fract(52.9829189 * fract(dot(fc, vec2(0.06711056, 0.00583715))));
  float n2 = fract(52.9829189 * fract(dot(fc + 17., vec2(0.06711056, 0.00583715))));
  return c + (n + n2 - 1.) / 255.;
}
`;

const SKY_VS = `#version 300 es
out vec2 v_ndc;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2. - 1.;
  v_ndc = p; gl_Position = vec4(p, 0., 1.);
}`;
const SKY_FS = COMMON + `
in vec2 v_ndc; out vec4 o;
void main(){
  float sp = u_cam.z, cp = u_cam.w;
  vec3 rd = normalize(vec3(v_ndc.x*u_cam.x, -sp + cp*v_ndc.y*u_cam.y, -cp - sp*v_ndc.y*u_cam.y));
  vec3 c = skyCol(rd, 4, true);
  // sun disc with limb darkening, dimmed by haze near the horizon
  float ang = acos(clamp(dot(rd, u_sun), -1., 1.));
  float R = u_sunP.y;
  float disc = smoothstep(R, R*0.94, ang);
  float limb = 0.72 + 0.28 * sqrt(max(1. - (ang/R)*(ang/R), 0.));
  float hazeT = mix(0.55, 1., smoothstep(0.0, 0.035, rd.y));
  c += vec3(1.0,0.56,0.22) * 3.2 * disc * limb * hazeT;
  o = vec4(finish(c, gl_FragCoord.xy), 1.);
}`;

const WATER_VS = `#version 300 es
precision highp float;
in vec2 a_g;
uniform vec4 u_cam;       // tanX, tanY, sinP, cosP
uniform vec4 u_np;        // near, far, xSpread, camY
uniform vec4 u_wA[16];    // dirx, dirz, k, A
uniform vec4 u_wB[16];    // phase, steepness, wavelength, 0
out vec3 v_wp; out vec2 v_p0; out vec3 v_n; out float v_j; out float v_h;
void main(){
  float d = u_np.x * exp(a_g.y * log(u_np.y / u_np.x));
  vec2 p0 = vec2(a_g.x * d * u_np.z, -d);
  vec3 disp = vec3(0.);
  float nx = 0., nz = 0., ny = 0., jxx = 1., jzz = 1., jxz = 0.;
  for (int i = 0; i < 16; i++){
    vec4 A = u_wA[i]; vec4 B = u_wB[i];
    float fade = 1. - smoothstep(B.z*6., B.z*14., d);
    float th = A.z * dot(A.xy, p0) + B.x;
    float s = sin(th), c = cos(th);
    float amp = A.w * fade, st = B.y * fade;
    disp.xz += A.xy * (st / A.z * c) * smoothstep(1.5, 16., d);
    disp.y += amp * s;
    nx -= A.x * A.z * amp * c; nz -= A.y * A.z * amp * c; ny -= st * s;
    jxx -= st*A.x*A.x*s; jzz -= st*A.y*A.y*s; jxz -= st*A.x*A.y*s;
  }
  vec3 wp = vec3(p0.x + disp.x, disp.y - u_np.w, p0.y + disp.z);
  float sp = u_cam.z, cp = u_cam.w;
  float vx = wp.x, vy = wp.y*cp - wp.z*sp, depth = -wp.y*sp - wp.z*cp;
  float n = 0.5, f = 12000.;
  gl_Position = vec4(vx/u_cam.x, vy/u_cam.y, ((f+n)*depth - 2.*f*n)/(f-n), depth);
  v_wp = wp; v_p0 = p0; v_n = vec3(nx, 1. + ny, nz); v_j = jxx*jzz - jxz*jxz; v_h = disp.y;
}`;
const WATER_FS = COMMON + `
in vec3 v_wp; in vec2 v_p0; in vec3 v_n; in float v_j; in float v_h;
uniform vec4 u_look;   // glitter, detail, foam, sss
uniform vec3 u_peng;   // x, z (camera relative), unused
out vec4 o;
void main(){
  float dist = length(v_wp);
  vec3 V = -v_wp / dist;
  vec3 N = normalize(v_n);

  // detail normals: two scrolling anisotropic octaves, faded by pixel footprint
  vec2 fw = fwidth(v_p0);
  float fp = length(fw);
  float f1 = 1. - smoothstep(0.12, 0.42, fp / 1.5);
  float f2 = 1. - smoothstep(0.12, 0.42, fp / 0.6);
  float lost = (1. - f1) * 0.6 + (1. - f2) * 0.25;
  vec2 pA = v_p0 * vec2(0.62, 0.95) + vec2(0.3, -u_t * 1.15 * 0.95);
  vec2 pB = v_p0 * vec2(1.6, 2.3) + vec2(-0.2, -u_t * 0.8 * 2.3) + 5.1;
  vec3 gA = noised(pA); vec3 gB = noised(pB);
  vec2 sl = vec2(gA.y * 0.62, gA.z * 0.95) * 0.07 * f1 + vec2(gB.y * 1.6, gB.z * 2.3) * 0.022 * f2;
  N.xz -= sl * u_look.y * exp(-dist / 160.);

  // the penguin's ripple ring
  vec2 pr = v_wp.xz - u_peng.xy;
  float rr = length(pr);
  float ring = sin(rr * 17. - u_t * 2.3) * exp(-rr * 1.5) * smoothstep(0.1, 0.4, rr) * (1. - smoothstep(2.0, 3.4, rr));
  N.xz += pr / (rr + 1e-3) * ring * 0.12;
  N = normalize(N);

  float nvRaw = dot(N, V);
  if (nvRaw < 0.04) { N = normalize(N + V * (0.04 - nvRaw)); }
  float NV = clamp(dot(N, V), 0.03, 1.);
  float F = 0.02 + 0.98 * pow(1. - NV, 5.);

  // sky reflection: the swell tilts the mirror, detail is filtered with distance
  vec3 Nr = normalize(mix(N, vec3(0.,1.,0.), 1. - exp(-dist / 420.)));
  vec3 R = reflect(-V, Nr);
  R.y = abs(R.y);
  vec3 refl = skyCol(R, 2, false);

  // sun glitter: GGX with roughness growing as the small waves go sub-pixel
  vec3 L = u_sun;
  vec3 H = normalize(L + V);
  float NH = max(dot(N, H), 0.), NL = max(dot(N, L), 0.), VH = max(dot(V, H), 0.);
  float alpha = mix(0.035, 0.20, 1. - exp(-dist / 380.)) + lost * 0.05;
  float a2 = alpha * alpha;
  float dd = NH*NH*(a2 - 1.) + 1.;
  float D = a2 / (PI * dd * dd);
  float Fs = 0.02 + 0.98 * pow(1. - VH, 5.);
  float k = alpha * 0.5;
  float G = (NL / (NL*(1.-k) + k)) / (4. * (NV*(1.-k) + k));
  float omega = PI * u_sunP.y * u_sunP.y;
  vec3 spec = u_sunCol * (u_sunP.x * omega) * D * Fs * G * u_look.x;

  // body colour and subsurface glow on backlit crests
  float hN = clamp(v_h / 2.4 + 0.45, 0., 1.);
  float back = pow(max(dot(-V, L), 0.), 3.);
  float thick = hN * hN * (0.25 + 0.75 * back) * (0.55 + 0.45 * smoothstep(-0.25, 0.35, N.z));
  vec3 body = vec3(0.010, 0.028, 0.050) + vec3(0.03, 0.012, 0.035) * (0.4 + 0.6 * NV);

const NW = 16;

      wPh = new Float64Array(NW);
function buildWaves() {

// ---------------------------------------------------------------- camera / layout
const cam = { tanX: 0.6, tanY: 0.4, pitch: 0.05, sinP: 0.05, cosP: 1, aspect: 1.6, y: 3.2 };
const camU = new Float32Array(4);
const npU = new Float32Array(4);

function layout() {
  const W = window.innerWidth, H = window.innerHeight;

// ---------------------------------------------------------------- penguin behaviour

<script>

// 3. ENGINE golden: baked spectrum

  rays: { strength: 0.05, sway: 0.004 },
  haze: { fogDistance: 1900, exposure: 0.55, vignette: 0.16 },
  // two spectral bands, each baked to its own tile

/* ------------------------- spectral synthesis ------------------------ */
function bakeBand(band, seed, rowsPerChunk, onRows) {

        CXX = new Float32Array(T), CZZ = new Float32Array(T), CXZ = new Float32Array(T);

                cd = cdx[i], sd = sdx[i];

            CXX[idx] += wxx * c; CZZ[idx] += wzz * c; CXZ[idx] += wxz * c;

        fl[i * 4 + 2] = H[i] / hMax * 0.5 + 0.5;
        fl[i * 4 + 3] = smooth(0.78, 0.22, J[i]);   // foam where the surface compresses
      }

/* tileable fbm value noise: R clouds, G rays, B low-frequency shape, A foam streak noise */
function bakeNoise() {

      let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);

/* --------------------------- shader source --------------------------- */
function buildFrag(W) {

precision highp float;
precision highp sampler2D;
uniform sampler2D uA; uniform sampler2D uB; uniform sampler2D uC;
uniform vec2 uRes;
uniform float uT;
uniform vec3 uCam;      // focal, height, horizon (p-units)
uniform vec3 uSun;      // unit direction
uniform vec2 uSunS;     // sun in p-units
uniform vec2 uSunCP;    // sun in cloud-plane coordinates
uniform vec4 uDec;      // slopeMaxA, heightMaxA, slopeMaxB, heightScale
uniform vec4 uPeng;     // anchor p.xy, scale (p-units per body unit), roll
uniform vec4 uPA;       // head turn, flipper, pitch, time
uniform vec4 uCloud;    // bankTop, softness, rays strength, rays sway

const float LA = ${f(sA.tile)}, LB = ${f(sB.tile)};

const vec2 DA2 = vec2(${f(dirA2[0])}, ${f(dirA2[1])}) * ${f(w.speedA2)};
const vec2 DB1 = vec2(${f(dirB1[0])}, ${f(dirB1[1])}) * ${f(w.speedB1)};
const vec2 DB2 = vec2(${f(dirB2[0])}, ${f(dirB2[1])}) * ${f(w.speedB2)};

const mat2 RB2 = ${rot(w.rotB2)};

// ---------------- sky (after direction A's palette) ----------------
vec3 skyClear(vec3 rd, float disc) {
  float y = max(rd.y, 0.0);
  float mu = max(dot(rd, uSun), 0.0);
  vec3 hor = mix(vec3(0.55, 0.32, 0.36), vec3(1.0, 0.56, 0.24), smoothstep(0.0, 0.9, pow(mu, 1.5)));
  vec3 mid = mix(vec3(0.24, 0.20, 0.50), vec3(0.62, 0.34, 0.42), pow(mu, 3.0));

vec3 sky(vec3 rd, float full) {

  float dn = texture(uC, vec2(cp.x * 0.9, cp.y * 0.07) + 0.2).r;
  float cov = smoothstep(0.66, 0.84, dn) * smoothstep(0.015, 0.12, y) * (1.0 - smoothstep(0.12, 0.32, y)) * 0.8;

// ---------------- penguin: front-on, chubby pear, pale eyes, flippers out ----------------
float sdEll(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }

vec3 penguin(vec3 col, vec2 p) {

    float bel = (1.0 - smoothstep(-0.05, 0.05, sdEll(q - vec2(0.0, -0.18), vec2(0.70, 0.66)))) * smoothstep(0.55, 0.30, q.y - 0.35 * abs(q.x));
    vec3 bc3 = mix(vec3(0.26, 0.30, 0.40), vec3(0.58, 0.60, 0.68), smoothstep(0.7, 0.0, abs(q.x))) ;
    bc3 += vec3(0.25, 0.12, 0.04) * smoothstep(0.0, 0.7, q.x) * 0.6;
    pc = mix(pc, bc3, bel);
    // eyes: big, pale pinkish-white, wide set, pupils follow the look
    for (int k = 0; k < 2; k++) {
      float sx = k == 0 ? -1.0 : 1.0;

      pc = mix(pc, vec3(0.95, 0.80, 0.82), 1.0 - smoothstep(-aa, aa, de));
      float dp = length(q - ec - vec2(lk * 0.55 - sx * 0.02, -0.03)) - 0.10;

    pc = mix(pc, vec3(0.95, 0.46, 0.08), 1.0 - smoothstep(-aa, aa, db));

vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

    vec2 gx = dFdx(xz0), gy = dFdy(xz0);

    vec4 a2 = textureGrad(uA, (RA2 * xz - DA2 * uT) / (LA * SA2), RA2 * gx / (LA * SA2), RA2 * gy / (LA * SA2));
    vec4 b1 = textureGrad(uB, (xz - DB1 * uT) / LB, gx / LB, gy / LB);
    vec4 b2 = textureGrad(uB, (RB2 * xz - DB2 * uT) / (LB * SB2), RB2 * gx / (LB * SB2), RB2 * gy / (LB * SB2));
    vec2 sA = ((a1.xy * 2.0 - 1.0) * WA1 + ((a2.xy * 2.0 - 1.0) * RA2) / SA2 * WA2) * uDec.x;
    vec2 sB = ((b1.xy * 2.0 - 1.0) * WB1 + ((b2.xy * 2.0 - 1.0) * RB2) / SB2 * WB2) * uDec.z;
    float fadeB = 1.0 - smoothstep(12.0, 170.0, t);
    vec2 s = sA + sB * fadeB;
    vec3 n = normalize(vec3(-s.x, 1.0, -s.y));
    float hh = ((a1.z * 2.0 - 1.0) * WA1 + (a2.z * 2.0 - 1.0) * WA2);   // roughly -1.5..1.5

    vec3 v = -rd;
    float ndv = clamp(dot(n, v), 0.0, 1.0);
    float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);
    vec3 R = reflect(rd, n);
    R.y = abs(R.y) + 0.0015;
    vec3 refl = sky(R, 0.0) * 0.85;

    // gold sun glitter: lobe widens with distance (A's formula, driven by the baked normals)
    float dRL = max(dot(R, uSun), 0.0);
    float expo = mix(1800.0, 260.0, smoothstep(5.0, 400.0, t));
    float glit = pow(dRL, expo) * (expo * 0.016) + pow(dRL, 80.0) * 0.5;
    vec3 sunCol = vec3(1.0, 0.74, 0.42);

    // body: deep teal, green-gold glow in crests toward the sun
    float hN = clamp(hh * 0.28 + 0.5 + dot(s, normalize(uSun.xz)) * 1.2, 0.0, 1.0);
    vec3 deep = vec3(0.012, 0.075, 0.095);
    float toSun = pow(max(dot(normalize(uSun.xz), normalize(rd.xz)), 0.0), 2.0);
    float sss = smoothstep(0.42, 0.95, hN) * (0.25 + 0.75 * toSun);
    vec3 body = deep + vec3(0.025, 0.15, 0.10) * sss * vec3(1.0, 0.95, 0.55) * 0.9;
    body += vec3(0.02, 0.05, 0.07) * (0.5 + 0.5 * n.y);
    body *= mix(0.55, 1.0, hN);

    col = body * (1.0 - F) + F * refl + sunCol * glit * F * 2.2;

    // whitecaps / foam from the baked compression map, broken up by noise
    float fn = textureGrad(uC, vec2(xz.x * 0.011, xz.y * 0.011 + uT * 0.0007), gx * 0.011, gy * 0.011).a;
    float foam = smoothstep(0.18, 0.7, max(a1.w, b1.w * 0.9)) * smoothstep(0.35, 0.7, fn + 0.25 * b2.w);
    foam *= (1.0 - smoothstep(120.0, 700.0, t)) * smoothstep(4.0, 14.0, t);
    col = mix(col, vec3(0.9, 0.62, 0.42) * (0.6 + 1.2 * toSun), foam * 0.9);

    // aerial haze to the horizon colour
    vec3 hz = skyClear(normalize(vec3(rd.x, 0.012, rd.z)), 0.0);
    float fog = 1.0 - exp(-t * 0.0011);
    col = mix(col, hz, fog * fog * 0.8 + fog * 0.2);
    col = mix(col, hz, smoothstep(2500.0, 9000.0, t));
  } else {
    col = sky(rd, 1.0);
  }

  // crepuscular rays: angular fan from the sun, strongest in the sky above the bank
  vec2 dsun = p - uSunS;
  float r = length(dsun);
  float ang = atan(dsun.y, dsun.x);
  float rt = textureLod(uC, vec2(ang * 0.477465 + uCloud.w * uT * 4.0, 0.5), 0.0).g;
  float rt2 = textureLod(uC, vec2(ang * 0.95493 - uCloud.w * uT * 2.0 + 0.31, 0.5), 0.0).g;
  float rays = smoothstep(0.03, 0.30, r) * pow(clamp((rt * 0.65 + rt2 * 0.5 - 0.30) * 1.9, 0.0, 1.0), 1.7);
  float vis = mix(0.28, 1.0, smoothstep(-0.05, 0.12, p.y - HZ));
  col += SUNC * (0.55 + 0.45 * vec3(1.0, 0.85, 0.7)) * rays * exp(-r * 1.15) * uCloud.z * vis * 0.55;

  col = penguin(col, p);

  col *= ${f(CONFIG.haze.exposure)};
  col *= 1.0 - ${f(CONFIG.haze.vignette)} * dot(p * 0.55, p * 0.55);
  col = aces(col);
  col = mix(vec3(dot(col, vec3(0.299, 0.587, 0.114))), col, 1.3);
  // a hint of cool lift in the shadows for the melancholy read
  col = pow(col, vec3(1.0 / 2.2));
  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  col += (ign - 0.5) / 255.0;
  oCol = vec4(col, 1.0);
}`;
}

const VERT = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);

/* ------------------------------- state ------------------------------- */
const S = {
  gl: null, prog: null, vao: null, tex: [], loc: {}, ready: false, running: false, raf: 0,
  baked: null, A: null, B: null, noise: null,
  w: 0, h: 0, cssW: 0, cssH: 0, aspect: 1,
  quality: CONFIG.quality.scaleStart, ceiling: CONFIG.quality.scaleMax, lastChange: 0,
  t: 0, last: 0, ema: 16.7, slow: 0, fast: 0, frames: 0, motion: 1,
  f: CONFIG.camera.focal, hz: 0, sun: [0, 0, -1], sunS: [0, 0], sunCP: [0, 0],
  pg: { x0: 0, z0: -9, x: 0, z: -9, h: 0, roll: 0, pitch: 0, turn: 0, turnFrom: 0, turnTo: 0, turnAt: -99, nextTurn: 4,
        flip: 0, flipAt: -99, nextFlip: 9, rs: 0x1234567, sx: 0, sy: 0, scale: 0.02, hs: 0 },

const reduced = matchMedia('(prefers-reduced-motion: reduce)');

/* ----------------- CPU wave sampling (mirrors the shader) ----------------- */

  u -= Math.floor(u); v -= Math.floor(v);
  const fx = u * N - 0.5, fy = v * N - 0.5;
  let x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx - x0, ty = fy - y0;
  x0 = (x0 + N) % N; y0 = (y0 + N) % N;

function waveH(x, z, t) {
  const A = S.A, N = CONFIG.texSize, L = SA.tile;

  const rx = cA2 * x - sA2 * z, rz = sA2 * x + cA2 * z;      // RA2 * xz
  const h2 = texH(A.px, N, (rx - dA2[0] * t) / (L * W.scaleA2), (rz - dA2[1] * t) / (L * W.scaleA2)) * 2 - 1;
  return (h1 * W.weightA1 + h2 * W.weightA2) * A.hMax * W.heightScale;

/* -------------------------- penguin behaviour -------------------------- */
function rand(pg) { // xorshift, no allocation
  let x = pg.rs; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; pg.rs = x >>> 0; return pg.rs / 4294967296;

function updatePenguin(t) {
  const pg = S.pg, P = CONFIG.penguin, f = S.f, Hc = CONFIG.camera.height;
  pg.x = pg.x0 + Math.sin(t * 0.043) * P.drift[0] + Math.sin(t * 0.017 + 2.0) * P.drift[0] * 0.5;
  pg.z = pg.z0 + Math.sin(t * 0.031 + 1.0) * P.drift[1];
  const g = P.waveGain;
  const h = waveH(pg.x, pg.z, t) * g;
  const e = 0.45;
  const sx = (waveH(pg.x + e, pg.z, t) - waveH(pg.x - e, pg.z, t)) / (2 * e) * g;
  const sz = (waveH(pg.x, pg.z + e, t) - waveH(pg.x, pg.z - e, t)) / (2 * e) * g;
  pg.h = pg.h + (h - pg.h) * 0.35;                      // a little inertia: it floats, it doesn't ride the field rigidly
  pg.roll = pg.roll + (clamp(-sx * 1.6, -0.45, 0.45) - pg.roll) * 0.15;
  pg.pitch = pg.pitch + (clamp(sz * 2.2, -1, 1) - pg.pitch) * 0.15;

  if (t >= pg.nextTurn) {
    pg.turnFrom = pg.turn; pg.turnAt = t;
    pg.turnTo = rand(pg) < 0.25 ? 0.0 : (rand(pg) < 0.5 ? -1 : 1) * (0.45 + 0.55 * rand(pg));
    pg.nextTurn = t + 5 + rand(pg) * 8;

  const u = clamp((t - pg.turnAt) / 0.9, 0, 1);
  pg.turn = pg.turnFrom + (pg.turnTo - pg.turnFrom) * (u * u * (3 - 2 * u));

  if (t >= pg.nextFlip) { pg.flipAt = t; pg.nextFlip = t + 9 + rand(pg) * 12; pg.dbl = rand(pg) < 0.3; }
  const ft = t - pg.flipAt;
  pg.flip = ft < 0 || ft > 1.3 ? 0 :
            Math.pow(Math.sin(clamp(ft / 0.55, 0, 1) * Math.PI), 2) + (pg.dbl ? 0.7 * Math.pow(Math.sin(clamp((ft - 0.55) / 0.5, 0, 1) * Math.PI), 2) : 0);

  const dz = -pg.z;

}

/* ---------------------------- GL plumbing ---------------------------- */
function compile(gl, type, src) {

function makeTex(gl, band, unit, useFloat) {

  if (useFloat && band.fl) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, N, N, 0, gl.RGBA, gl.FLOAT, band.fl);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, band.px || band);

function initGL() {

  if (!gl) return false;
  const vs = compile(gl, gl.VERTEX_SHADER, VERT), fs = compile(gl, gl.FRAGMENT_SHADER, buildFrag());
  if (!vs || !fs) return false;

/* --------------------------- layout & quality -------------------------- */
function layout() {
  const C = CONFIG.camera;
  S.cssW = Math.max(1, window.innerWidth); S.cssH = Math.max(1, window.innerHeight);
  S.aspect = S.cssW / S.cssH;
  S.f = C.focal + (C.focalPortrait - C.focal) * clamp((1 - S.aspect) / 0.55, 0, 1);
  S.hz = 1 - 2 * C.horizon;
  // sun
  const sp = [(2 * CONFIG.sun.x - 1) * S.aspect, S.hz + 2 * CONFIG.sun.above];
  const d = [sp[0], sp[1] - S.hz, -S.f], l = Math.hypot(d[0], d[1], d[2]);
  S.sun = [d[0] / l, d[1] / l, d[2] / l]; S.sunS = sp;
  S.sunCP = [S.sun[0] / (S.sun[1] + 0.10), S.sun[2] / (S.sun[1] + 0.10)];
  // penguin anchor
  const P = CONFIG.penguin, pyT = S.hz + (-1 - S.hz) * P.below, pxT = (2 * P.x - 1) * S.aspect;
  const dz = S.f * C.height / (S.hz - pyT);
  S.pg.z0 = -dz; S.pg.x0 = pxT * dz / S.f;
  applySize();
  if (S.gl) {
    const gl = S.gl, L = S.loc;
    gl.uniform3f(L.uSun, S.sun[0], S.sun[1], S.sun[2]);
    gl.uniform2f(L.uSunS, S.sunS[0], S.sunS[1]);

  const W2 = Math.max(160, Math.round(w * sc)), H2 = Math.max(160, Math.round(h * sc));
  if (canvas.width !== W2 || canvas.height !== H2) {
    canvas.width = W2; canvas.height = H2;

  S.w = canvas.width; S.h = canvas.height;
  if (S.gl) { S.gl.viewport(0, 0, S.w, S.h); S.gl.uniform2f(S.loc.uRes, S.w, S.h); }
}
function govern(dtMs, now) {

  if (++S.frames < Q.warmupFrames) return;

  if (S.ema > Q.slowMs) { S.slow++; S.fast = 0; } else if (S.ema < Q.fastMs) { S.fast++; S.slow = 0; } else { S.slow = 0; S.fast = 0; }

S.lastUp = -1e9;

function start() {

}

document.addEventListener('visibilitychange', () => { document.hidden ? stop() : (window.__oceanActive === 'golden' && start()); });
let rzT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rzT); rzT = setTimeout(() => { layout(); if (S.ready && !S.running) draw(); }, 80);
});
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); stop(); S.ready = false; });
canvas.addEventListener('webglcontextrestored', () => { if (initGL()) { S.ready = true; layout(); start(); } });

/* --------------------------------- boot -------------------------------- */
async function boot() {
  if (!canvas.getContext) return fallback('This scene needs a canvas.');
  const test = document.createElement('canvas');
  if (!test.getContext('webgl2')) return fallback('WebGL2 is not available here, so this is a still.');
  layout();
  const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
  const SP = CONFIG.spectrum;
  if (lowEnd) { SP.swell.comps = Math.round(SP.swell.comps * 0.7); SP.chop.comps = Math.round(SP.chop.comps * 0.7); }
  const t0 = performance.now();
  S.A = await bakeBand(SP.swell, CONFIG.seed * 101 + 1, 16);
  S.B = await bakeBand(SP.chop, CONFIG.seed * 101 + 2, 16);
  S.noise = bakeNoise();
  S.bakeMs = performance.now() - t0;
  console.info('[ocean] baked in ' + S.bakeMs.toFixed(0) + 'ms; comps ' + S.A.comps + '/' + S.B.comps +
               '; slopeMax ' + S.A.sMax.toFixed(3) + '/' + S.B.sMax.toFixed(3) + '; hMax ' + S.A.hMax.toFixed(2) +
               '; jMin ' + S.A.jMin.toFixed(2) + '/' + S.B.jMin.toFixed(2));
  if (!initGL()) return fallback('The shader could not be compiled here, so this is a still.');
  S.ready = true; layout();
  S.t = 12 + Math.random() * 40;

window.__oceans.golden = {
  config: CONFIG, state: S,
  step, draw: () => S.ready && draw(),
  get scale() { return S.quality; },
  setScale(s) { S.quality = clamp(s, 0.25, 1); S.ceiling = Math.max(S.ceiling, S.quality); applySize(); if (S.ready && !S.running) draw(); },
  setTime(t) { S.t = t; if (S.ready) draw(); },
  get frameMs() { return S.ema; },
  get penguin() { return S.pg; },
  stop, start

boot();
};

<script>
'use strict';
// 4. Controller
(function () {
  var LOOKS = {
    golden: { theme: '#e0b070' },
    sunset: { theme: '#1a0a24' }

  var DEFAULT = 'golden', KEY = 'ocean:look';
  var root = document.documentElement;
  var meta = document.querySelector('meta[name="theme-color"]');
  var canvases = {}, buttons = {};
  Object.keys(LOOKS).forEach(function (n) { canvases[n] = document.getElementById('sea-' + n); });
  Array.prototype.forEach.call(document.querySelectorAll('.looks button'), function (b) { buttons[b.dataset.look] = b; });

  var active = null, built = {}, ready = {}, z = 1;

  function initial() {
    var q = new URLSearchParams(location.search).get('look');
