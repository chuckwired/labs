<body>
<a class="back" href="../../../">← Labs</a>
<canvas id="sea" role="img" aria-label="A calm open ocean at golden hour, the sun veiled by a low bank of cloud. A tiny penguin floats far off to the right."></canvas>

<script>
'use strict';
/* ------------------------------------------------------------------ *
 *  Ocean C: baked spectrum, cloud-veiled sun.
 *  A tileable wave field is synthesised once on the CPU (directional
 *  JONSWAP-ish spectrum summed over ~100 components per band, written to
 *  RGBA8: slope x, slope z, height, foam/jacobian). At runtime a single
 *  fragment shader intersects a plane analytically and samples the baked
 *  field at four advected scales. No per-frame allocations.
 * ------------------------------------------------------------------ */
const CONFIG = {
  texSize: 256,                 // tile resolution (power of two)
  seed: 11,
  // camera: focal length (vertical), height above mean sea level in metres,
  // horizon as fraction of screen height from the top
  camera: { focal: 1.7, focalPortrait: 1.2, height: 2.6, horizon: 0.40 },
  // sun placed on screen: x as fraction of width, elevation as fraction of screen height above the horizon
  sun: { x: 0.31, above: 0.062, color: [1.0, 0.60, 0.27] },
  clouds: { bankTop: 0.19, wind: [0.0011, 0.0004], softness: 1.0 },
  rays: { strength: 0.34, sway: 0.004 },
  haze: { fogDistance: 1900, exposure: 0.92, vignette: 0.16 },
  // two spectral bands, each baked to its own tile
  spectrum: {
    swell: { tile: 420, comps: 96, lambdaMin: 8, lambdaMax: 150, peak: 52, dir: 0.28, spread: 0.42, iso: 0.08,
             slope: 0.034, choppy: 2.6, gamma: 3.0 },
    chop:  { tile: 28,  comps: 80, lambdaMin: 0.38, lambdaMax: 6.5, peak: 2.4, dir: 0.18, spread: 0.85, iso: 0.22,
             slope: 0.095, choppy: 1.3, gamma: 1.5 }
  },
  waves: {
    heightScale: 1.0,
    // advection speeds in metres/second of the sampled tile (slowed for the calm look)
    speedA1: 2.6, speedA2: 3.3, speedB1: 0.9, speedB2: 1.25,
    scaleA2: 1.7, scaleB2: 0.42, rotA2: 0.62, rotB2: -0.43,
    weightA1: 0.9, weightA2: 0.55, weightB1: 1.0, weightB2: 0.42
  },
  penguin: {
    x: 0.645,            // fraction of width
    below: 0.40,         // fraction of the way from horizon to bottom of screen
    bodyMetres: 0.135,    // metres per body-unit in the SDF (back is ~2.2 units wide)
    drift: [0.5, 0.35],  // slow wander in metres
    waveGain: 1.0
  },
  quality: {
    dprCap: 2, maxPixels: 2.6e6, scaleMin: 0.5, scaleMax: 1.0, scaleStart: 0.85,
    slowMs: 24, fastMs: 17.5, slowFrames: 40, fastFrames: 200, cooldownMs: 2500, warmupFrames: 25
  },
  reducedMotion: 0.22   // time multiplier under prefers-reduced-motion
};

(function () {
const canvas = document.getElementById('sea');
const TAU = Math.PI * 2;

/* ------------------------------ helpers ------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function fallback(msg) {
  document.documentElement.classList.add('nogl');
  canvas.style.display = 'none';
  if (msg) {
    const p = document.createElement('p');
    p.className = 'note'; p.textContent = msg;
    document.body.appendChild(p);
  }
}

/* ------------------------- spectral synthesis ------------------------ */
function bakeBand(band, seed, rowsPerChunk, onRows) {
  const N = CONFIG.texSize, L = band.tile, dx = L / N, g = 9.81;
  const rnd = mulberry32(seed);
  const n = band.comps;
  const kx = new Float32Array(n), kz = new Float32Array(n), kl = new Float32Array(n),
        ph = new Float32Array(n), am = new Float32Array(n);
  const wp = Math.sqrt(g * TAU / band.peak);
  let m = 0, tries = 0, lim = N / 2 - 3;
  while (m < n && tries < n * 40) {
    tries++;
    const u = (m + rnd()) / n;
    const lam = Math.exp(Math.log(band.lambdaMin) + u * (Math.log(band.lambdaMax) - Math.log(band.lambdaMin)));
    let th;
    if (rnd() < band.iso) th = (rnd() * 2 - 1) * Math.PI;
    else {
      const r1 = Math.max(rnd(), 1e-6), r2 = rnd();
      th = band.dir + Math.sqrt(-2 * Math.log(r1)) * Math.cos(TAU * r2) * band.spread;
    }
    const fi = Math.round(L / lam * Math.sin(th)), fj = Math.round(L / lam * Math.cos(th));
    if ((fi === 0 && fj === 0) || Math.abs(fi) > lim || Math.abs(fj) > lim) continue;
    kx[m] = TAU * fi / L; kz[m] = TAU * fj / L;
    kl[m] = Math.hypot(kx[m], kz[m]);
    const w = Math.sqrt(g * kl[m]);
    const r = Math.exp(-0.5 * Math.pow((w - wp) / (0.09 * wp), 2));
    const a2 = Math.pow(w, -4) * Math.exp(-1.25 * Math.pow(wp / w, 4)) * Math.pow(band.gamma, r) * (0.55 + 0.9 * rnd());
    am[m] = Math.sqrt(a2); ph[m] = rnd() * TAU; m++;
  }
  const nc = m;
  let v = 0;
  for (let i = 0; i < nc; i++) v += am[i] * am[i] * kl[i] * kl[i] * 0.5;
  const k = band.slope / Math.sqrt(v);
  for (let i = 0; i < nc; i++) am[i] *= k;

  const T = N * N;
  const H = new Float32Array(T), SX = new Float32Array(T), SZ = new Float32Array(T),
        CXX = new Float32Array(T), CZZ = new Float32Array(T), CXZ = new Float32Array(T);
  const cdx = new Float32Array(nc), sdx = new Float32Array(nc);
  for (let i = 0; i < nc; i++) { cdx[i] = Math.cos(kx[i] * dx); sdx[i] = Math.sin(kx[i] * dx); }

  return new Promise(resolve => {
    let row = 0;
    function chunk() {
      const end = Math.min(N, row + rowsPerChunk);
      for (; row < end; row++) {
        const z = row * dx, base = row * N;
        for (let i = 0; i < nc; i++) {
          const th0 = kz[i] * z + ph[i];
          let c = Math.cos(th0), s = Math.sin(th0);
          const a = am[i], ax = a * kx[i], az = a * kz[i],
                wxx = a * kx[i] * kx[i] / kl[i], wzz = a * kz[i] * kz[i] / kl[i], wxz = a * kx[i] * kz[i] / kl[i],
                cd = cdx[i], sd = sdx[i];
          for (let x = 0; x < N; x++) {
            const idx = base + x;
            H[idx] += a * c; SX[idx] -= ax * s; SZ[idx] -= az * s;
            CXX[idx] += wxx * c; CZZ[idx] += wzz * c; CXZ[idx] += wxz * c;
            const t = c * cd - s * sd; s = s * cd + c * sd; c = t;
          }
        }
      }
      if (onRows) onRows(row / N);
      if (row < N) setTimeout(chunk, 0);
      else finish();
    }
    function finish() {
      let sMax = 1e-6, hMax = 1e-6, jMin = 9;
      const J = new Float32Array(T), ch = band.choppy;
      for (let i = 0; i < T; i++) {
        sMax = Math.max(sMax, Math.abs(SX[i]), Math.abs(SZ[i]));
        hMax = Math.max(hMax, Math.abs(H[i]));
        const jx = 1 - ch * CXX[i], jz = 1 - ch * CZZ[i], jxz = ch * CXZ[i];
        J[i] = jx * jz - jxz * jxz; if (J[i] < jMin) jMin = J[i];
      }
      // normalised 0..1 floats; RGBA8 copy is the fallback when half-float textures can't be mipmapped
      const fl = new Float32Array(T * 4), px = new Uint8Array(T * 4);
      for (let i = 0; i < T; i++) {
        fl[i * 4]     = SX[i] / sMax * 0.5 + 0.5;
        fl[i * 4 + 1] = SZ[i] / sMax * 0.5 + 0.5;
        fl[i * 4 + 2] = H[i] / hMax * 0.5 + 0.5;
        fl[i * 4 + 3] = smooth(0.78, 0.22, J[i]);   // foam where the surface compresses
      }
      for (let i = 0; i < T * 4; i++) px[i] = Math.round(fl[i] * 255);
      resolve({ px, fl, sMax, hMax, jMin, comps: nc });
    }
    chunk();
  });
}

/* tileable fbm value noise: R clouds, G rays, B low-frequency shape, A foam streak noise */
function bakeNoise() {
  const N = CONFIG.texSize, out = new Uint8Array(N * N * 4);
  function hash(ix, iy, s) {
    let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function fbm(x, y, grid, oct, gain, seed) {
    let a = 1, sum = 0, tot = 0, gsz = grid;
    for (let o = 0; o < oct; o++) {
      const fx = x * gsz, fy = y * gsz, ix = Math.floor(fx), iy = Math.floor(fy);
      let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const x0 = ix % gsz, x1 = (ix + 1) % gsz, y0 = iy % gsz, y1 = (iy + 1) % gsz, s = seed + o * 17;
      const v = (hash(x0, y0, s) * (1 - tx) + hash(x1, y0, s) * tx) * (1 - ty) +
                (hash(x0, y1, s) * (1 - tx) + hash(x1, y1, s) * tx) * ty;
      sum += v * a; tot += a; a *= gain; gsz *= 2;
    }
    return sum / tot;
  }
  const chans = [[4, 6, 0.52, 3], [10, 3, 0.55, 29], [2, 2, 0.5, 71], [6, 5, 0.5, 113]];
  for (let c = 0; c < 4; c++) {
    const [grid, oct, gain, seed] = chans[c];
    const v = new Float32Array(N * N); let lo = 9, hi = -9;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const f = fbm(x / N, y / N, grid, oct, gain, seed + CONFIG.seed);
      v[y * N + x] = f; if (f < lo) lo = f; if (f > hi) hi = f;
    }
    for (let i = 0; i < N * N; i++) out[i * 4 + c] = Math.round((v[i] - lo) / (hi - lo) * 255);
  }
  return out;
}

/* --------------------------- shader source --------------------------- */
function buildFrag(W) {
  const w = CONFIG.waves, sA = CONFIG.spectrum.swell, sB = CONFIG.spectrum.chop;
  const f = x => x.toFixed(6);
  const dirA1 = [Math.sin(sA.dir), Math.cos(sA.dir)];
  const dirA2 = [Math.sin(sA.dir + 0.5 + w.rotA2), Math.cos(sA.dir + 0.5 + w.rotA2)];
  const dirB1 = [Math.sin(sB.dir + 0.12), Math.cos(sB.dir + 0.12)];
  const dirB2 = [Math.sin(sB.dir - 0.35 + w.rotB2), Math.cos(sB.dir - 0.35 + w.rotB2)];
  const rot = a => `mat2(${f(Math.cos(a))}, ${f(Math.sin(a))}, ${f(-Math.sin(a))}, ${f(Math.cos(a))})`;
  return `#version 300 es
precision highp float;
precision highp sampler2D;
uniform sampler2D uA; uniform sampler2D uB; uniform sampler2D uC;
uniform vec2 uRes;
uniform float uT;
uniform vec3 uCam;      // focal, height, horizon (p-units)
uniform vec3 uSun;      // unit direction
uniform vec2 uSunS;     // sun in p-units
uniform vec2 uSunCP;    // sun in cloud-plane coordinates
uniform vec4 uDec;      // slopeMaxA, heightMaxA, slopeMaxB, heightScale
uniform vec4 uPeng;     // anchor p.xy, scale (p-units per body unit), roll
uniform vec4 uPA;       // head turn, flipper, pitch, time
uniform vec4 uCloud;    // bankTop, softness, rays strength, rays sway
out vec4 oCol;

const float LA = ${f(sA.tile)}, LB = ${f(sB.tile)};
const vec2 DA1 = vec2(${f(dirA1[0])}, ${f(dirA1[1])}) * ${f(w.speedA1)};
const vec2 DA2 = vec2(${f(dirA2[0])}, ${f(dirA2[1])}) * ${f(w.speedA2)};
const vec2 DB1 = vec2(${f(dirB1[0])}, ${f(dirB1[1])}) * ${f(w.speedB1)};
const vec2 DB2 = vec2(${f(dirB2[0])}, ${f(dirB2[1])}) * ${f(w.speedB2)};
const mat2 RA2 = ${rot(w.rotA2)};
const mat2 RB2 = ${rot(w.rotB2)};
const float SA2 = ${f(w.scaleA2)}, SB2 = ${f(w.scaleB2)};
const float WA1 = ${f(w.weightA1)}, WA2 = ${f(w.weightA2)}, WB1 = ${f(w.weightB1)}, WB2 = ${f(w.weightB2)};
const vec3 SUNC = vec3(${f(CONFIG.sun.color[0])}, ${f(CONFIG.sun.color[1])}, ${f(CONFIG.sun.color[2])});

// ---------------- sky ----------------
vec3 skyClear(vec3 rd, float disc) {
  float e = clamp(rd.y, 0.0, 1.0);
  vec2 az = normalize(rd.xz + 1e-5);
  float sunAz = max(dot(az, normalize(uSun.xz)), 0.0);
  float warm = pow(sunAz, 2.6);
  vec3 cool = mix(vec3(0.34, 0.43, 0.47), vec3(0.15, 0.29, 0.40), pow(smoothstep(0.0, 0.30, e), 0.65));
  cool = mix(cool, vec3(0.020, 0.062, 0.115), smoothstep(0.12, 0.95, e));
  vec3 peach = mix(vec3(0.80, 0.37, 0.19), vec3(0.40, 0.31, 0.32), smoothstep(0.0, 0.34, e));
  vec3 col = mix(cool, peach, warm * (1.0 - smoothstep(0.0, 0.75, e)));
  // a faint pale-gold seam hugging the horizon
  col += vec3(0.20, 0.14, 0.08) * exp(-e * 22.0) * (0.35 + 0.65 * warm);
  float cs = max(dot(rd, uSun), 0.0);
  col += SUNC * (pow(cs, 5.0) * 0.09 + pow(cs, 24.0) * 0.17 + pow(cs, 420.0) * 1.2 * disc);
  return col;
}

float cloudDens(vec2 cp, float e, float soft) {
  vec2 uv = vec2(cp.x * 0.10, cp.y * 0.55) + vec2(uCloud.w) * uT * vec2(0.25, 0.1) + vec2(uT * 0.0011, uT * 0.0003);
  float n = texture(uC, uv).r;
  float s = texture(uC, uv * vec2(0.23, 0.31) + 0.37).b;
  float top = uCloud.x + (s - 0.5) * 0.15;
  float cov = smoothstep(top, top - 0.075, e);
  float d = n * (0.22 + 0.98 * cov) * 1.38;
  return smoothstep(0.34 - 0.16 * soft, 0.86 + 0.30 * soft, d);
}

vec3 sky(vec3 rd, float full) {
  vec3 base = skyClear(rd, full);
  float e = rd.y;
  if (e < 0.0005) return base;
  vec2 cp = rd.xz / (e + 0.10);
  float dn = cloudDens(cp, e, 1.0 - full);
  float a = dn * smoothstep(0.0, 0.045, e);
  float cs = max(dot(rd, uSun), 0.0);
  float lit;
  if (full > 0.5) {
    vec2 toSun = uSunCP - cp;
    float dl = cloudDens(cp + normalize(toSun + 1e-4) * 0.45, e + clamp((uSun.y - e) * 0.5, -0.03, 0.03), 0.0);
    lit = exp(-2.6 * dl);
  } else {
    lit = 0.35 + 0.65 * pow(cs, 0.35);
  }
  vec3 shade = mix(vec3(0.11, 0.13, 0.19), vec3(0.22, 0.19, 0.22), exp(-e * 9.0));
  vec3 gold = vec3(1.0, 0.64, 0.36) * (0.55 + 2.2 * pow(cs, 2.5));
  vec3 cc = mix(shade, gold, lit);
  // thin edges toward the sun burn bright
  cc += SUNC * pow(cs, 10.0) * (1.0 - dn) * dn * 4.0 * lit * full;
  // sun leaks through thin cloud
  cc += SUNC * pow(cs, 300.0) * (1.0 - dn) * 1.6 * full + SUNC * pow(cs, 70.0) * (1.0 - 0.55 * dn) * 0.9;
  return mix(base, cc, a);
}

// ---------------- penguin ----------------
float sdEll(vec2 p, vec2 r) { return (length(p / r) - 1.0) * min(r.x, r.y); }
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float sdSeg(vec2 p, vec2 a, vec2 b, float r) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }

vec3 penguin(vec3 col, vec2 p) {
  vec2 q = (p - uPeng.xy) / uPeng.z;
  if (abs(q.x) > 5.5 || q.y < -4.5 || q.y > 3.0) return col;
  float cr = cos(uPeng.w), sr = sin(uPeng.w);
  q = vec2(cr * q.x + sr * q.y, -sr * q.x + cr * q.y);
  float t = uPA.w;
  float wl = 0.04 * sin(q.x * 3.1 + t * 1.3) + 0.03 * sin(q.x * 7.0 - t * 2.1);
  // ripple rings (elliptic: we look along the water at a low angle)
  for (int k = 0; k < 2; k++) {
    float ph = fract(t * 0.11 + float(k) * 0.5);
    vec2 rq = vec2(q.x, (q.y + 0.16) / 0.26);
    float rr = length(rq);
    float r0 = 1.5 + ph * 3.2;
    float ring = exp(-pow((rr - r0) / (0.11 + 0.1 * ph), 2.0)) * pow(1.0 - ph, 1.6);
    col += vec3(0.30, 0.27, 0.23) * ring * 0.20 * step(q.y, 0.1);
    col *= 1.0 - 0.10 * ring * step(q.y, 0.1);
  }
  // reflection smear beneath: dark streak with a wobble, broken by horizontal lines
  float wob = 0.10 * sin(q.y * 8.0 + t * 1.7) + 0.06 * sin(q.y * 17.0 - t * 2.3);
  float sm = exp(-pow((q.x - 0.15 - wob) / 0.62, 2.0)) * smoothstep(-2.6, -0.05, q.y) * step(q.y, wl + 0.02);
  sm *= 0.55 + 0.45 * sin(q.y * 21.0 + t * 1.1);
  col = mix(col, vec3(0.012, 0.022, 0.030), sm * 0.34);
  col += vec3(0.30, 0.17, 0.08) * exp(-pow((q.x + 0.55 - wob * 2.0) / 0.20, 2.0)) * smoothstep(-1.5, -0.1, q.y) * step(q.y, wl) * 0.07;

  // body
  float turn = uPA.x;
  vec2 body = vec2(q.x - 0.05, q.y + 0.04);
  float d = sdEll(body, vec2(1.15, 0.5));
  // head: sits at the left end of the back, swivels with turn
  vec2 hc = vec2(-0.78 + 0.26 * turn, 0.64 + uPA.z * 0.5);
  float dh = length(q - hc) - 0.30;
  d = smin(d, dh, 0.35);
  float dn = sdSeg(q, vec2(-0.55, 0.12), hc - vec2(0.0, 0.1), 0.26);
  d = smin(d, dn, 0.2);
  // beak: foreshortened as the head turns toward the viewer
  float ba = turn * 1.35;
  vec2 bt = hc + vec2(sin(ba) * 0.52, -0.07 + uPA.z * 0.1);
  float db = sdSeg(q, hc + vec2(sin(ba) * 0.2, -0.04), bt, 0.055 * (0.4 + 0.6 * abs(cos(ba))));
  float dsil = min(d, db);
  // flipper: rests along the flank, lifts for a twitch
  float fa = mix(-0.30, 0.85, uPA.y);
  vec2 sh = vec2(0.10, 0.12);
  float df = sdSeg(q, sh, sh + vec2(cos(fa), sin(fa)) * 0.74, 0.07);
  dsil = min(dsil, df);
  float aa = fwidth(dsil) * 0.9 + 1e-4;
  float alpha = (1.0 - smoothstep(-aa, aa, dsil)) * smoothstep(wl - aa, wl + aa, q.y);
  if (alpha > 0.001) {
    vec2 gn = normalize(vec2(dFdx(dsil), dFdy(dsil)) + 1e-5);
    float edge = smoothstep(-0.34, 0.0, dsil);
    float rim = max(dot(gn, normalize(vec2(-0.92, 0.38))), 0.0);
    float sky = max(gn.y, 0.0);
    vec3 pc = vec3(0.012, 0.015, 0.022);
    pc += vec3(1.0, 0.55, 0.22) * pow(rim, 1.5) * edge * 0.55;   // gold rim from the low sun
    pc += vec3(0.10, 0.20, 0.27) * sky * edge * 0.6;            // cool sky on the shoulders
    // the ear patch: a speck of orange on the cheek
    float ear = 1.0 - smoothstep(0.0, 0.05, length(q - hc - vec2(sin(ba) * 0.1 + 0.02, -0.07)) - 0.045);
    pc = mix(pc, vec3(0.70, 0.34, 0.08), ear * 0.55 * (0.3 + 0.7 * abs(cos(ba))));
    // beak tip
    float bk = 1.0 - smoothstep(0.0, 0.05, db);
    pc = mix(pc, vec3(0.75, 0.42, 0.16), bk * 0.7);
    // wet sheen along the waterline
    pc += vec3(0.25, 0.20, 0.16) * exp(-pow((q.y - wl) / 0.06, 2.0)) * 0.35;
    col = mix(col, pc, alpha);

// ---------------- main ----------------
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main() {
  vec2 p = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;
  float F0 = uCam.x, HC = uCam.y, HZ = uCam.z;
  vec3 rd = normalize(vec3(p.x, p.y - HZ, -F0));
  vec3 col;

  if (rd.y < -0.0004) {
    float t0 = HC / -rd.y;
    vec2 xz0 = rd.xz * t0;
    vec2 xz = xz0;
    float h0 = uDec.w * uDec.y * WA1 * (textureLod(uA, (xz0 - DA1 * uT) / LA, 1.0).z * 2.0 - 1.0);
    float t = (HC - h0) / -rd.y;
    xz = rd.xz * t;

    // gradients come from the smooth first-hit position, not the height-corrected one (which would inject texture noise into the mip choice)
    vec2 gx = dFdx(xz0), gy = dFdy(xz0);
    vec4 a1 = textureGrad(uA, (xz - DA1 * uT) / LA, gx / LA, gy / LA);
    vec4 a2 = textureGrad(uA, (RA2 * xz - DA2 * uT) / (LA * SA2), RA2 * gx / (LA * SA2), RA2 * gy / (LA * SA2));
    vec4 b1 = textureGrad(uB, (xz - DB1 * uT) / LB, gx / LB, gy / LB);
    vec4 b2 = textureGrad(uB, (RB2 * xz - DB2 * uT) / (LB * SB2), RB2 * gx / (LB * SB2), RB2 * gy / (LB * SB2));
    vec2 sA = ((a1.xy * 2.0 - 1.0) * WA1 + ((a2.xy * 2.0 - 1.0) * RA2) / SA2 * WA2) * uDec.x;
    vec2 sB = ((b1.xy * 2.0 - 1.0) * WB1 + ((b2.xy * 2.0 - 1.0) * RB2) / SB2 * WB2) * uDec.z;
    float fadeB = 1.0 - smoothstep(12.0, 170.0, t);
    vec2 s = sA + sB * fadeB;
    vec3 n = normalize(vec3(-s.x, 1.0, -s.y));
    float hh = ((a1.z * 2.0 - 1.0) * WA1 + (a2.z * 2.0 - 1.0) * WA2);   // roughly -1.5..1.5

    vec3 v = -rd;
    float ndv = clamp(dot(n, v), 0.0, 1.0);
    float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);
    vec3 rf = reflect(rd, n);
    rf.y = abs(rf.y) + 0.0015;
    vec3 refl = sky(normalize(rf), 0.0);
    refl = refl / (1.0 + 0.30 * refl);

    // body colour: deep green-teal, gold over the sun side, glowing teal in backlit crests
    vec2 rh = normalize(rd.xz);
    float sunSide = pow(max(dot(rh, normalize(uSun.xz)), 0.0), 3.0);
    vec3 deep = mix(vec3(0.008, 0.045, 0.062), vec3(0.030, 0.052, 0.050), sunSide);
    vec3 teal = mix(vec3(0.016, 0.125, 0.130), vec3(0.110, 0.140, 0.090), sunSide * 0.6);
    float crest = smoothstep(-0.5, 1.4, hh * 0.9 + (-s.x * -0.0 + dot(s, normalize(uSun.xz)) * 3.0));
    float back = 0.30 + 0.70 * pow(max(dot(rh, normalize(uSun.xz)), 0.0), 1.5);
    vec3 body = mix(deep, teal * (0.35 + 0.65 * back), crest * crest * 0.7);

    col = body * (1.0 - F) + refl * F;

    // soft broad glitter: a wide lobe in slope space, widening with distance
    vec3 hv = normalize(uSun - rd);
    vec2 target = hv.xz / hv.y;
    vec2 dd = (-s) - target;
    float sig = 0.045 + t * 0.00022;
    float gl = exp(-dot(dd, dd * vec2(1.0, 0.45)) / (2.0 * sig * sig)) * (0.045 * 0.045) / (sig * sig);
    col += SUNC * gl * 0.55 * F;

    // foam: faint streaks along the wind
    float fz = smoothstep(0.55, 1.0, max(a1.w, b1.w * 0.8) * (0.55 + 0.9 * textureGrad(uC, vec2(xz.x * 0.0035, xz.y * 0.012 + uT * 0.0004), gx * vec2(0.0035, 0.012), gy * vec2(0.0035, 0.012)).a));
    float fd = (1.0 - smoothstep(40.0, 420.0, t)) * smoothstep(5.0, 20.0, t);
    col = mix(col, vec3(0.42, 0.46, 0.45) * (0.5 + 0.7 * back) + SUNC * 0.12 * sunSide, fz * fd * 0.32);

    // horizon haze
    float fog = 1.0 - exp(-t / ${f(CONFIG.haze.fogDistance)});
    vec3 hz = skyClear(normalize(vec3(rd.x, 0.0, rd.z)), 0.0);
    col = mix(col, hz, fog * fog * 0.85 + smoothstep(8000.0, 26000.0, t) * 0.15);
  } else {
    col = sky(rd, 1.0);
  }

  // crepuscular rays: angular fan from the sun, strongest in the sky above the bank
  vec2 dsun = p - uSunS;
  float r = length(dsun);
  float ang = atan(dsun.y, dsun.x);
  float rt = textureLod(uC, vec2(ang * 0.477465 + uCloud.w * uT * 4.0, 0.5), 0.0).g;
  float rt2 = textureLod(uC, vec2(ang * 0.95493 - uCloud.w * uT * 2.0 + 0.31, 0.5), 0.0).g;
  float rays = smoothstep(0.03, 0.30, r) * pow(clamp((rt * 0.65 + rt2 * 0.5 - 0.30) * 1.9, 0.0, 1.0), 1.7);
  float vis = mix(0.28, 1.0, smoothstep(-0.05, 0.12, p.y - HZ));
  col += SUNC * (0.55 + 0.45 * vec3(1.0, 0.85, 0.7)) * rays * exp(-r * 1.15) * uCloud.z * vis * 0.55;
  col += SUNC * exp(-r * 3.0) * 0.06;

  col = penguin(col, p);

  col *= ${f(CONFIG.haze.exposure)};
  col *= 1.0 - ${f(CONFIG.haze.vignette)} * dot(p * 0.55, p * 0.55);
  col = aces(col);
  // a hint of cool lift in the shadows for the melancholy read
  col = pow(col, vec3(1.0 / 2.2));
  float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  col += (ign - 0.5) / 255.0;
  oCol = vec4(col, 1.0);
}`;
}

const VERT = `#version 300 es
void main() {

/* ------------------------------- state ------------------------------- */
const S = {

  quality: CONFIG.quality.scaleStart, ceiling: CONFIG.quality.scaleMax, lastChange: 0,
  t: 0, last: 0, ema: 16.7, slow: 0, fast: 0, frames: 0, motion: 1,
  f: CONFIG.camera.focal, hz: 0, sun: [0, 0, -1], sunS: [0, 0], sunCP: [0, 0],

}

/* -------------------------- penguin behaviour -------------------------- */
function rand(pg) { // xorshift, no allocation

function updatePenguin(t) {

  pg.x = pg.x0 + Math.sin(t * 0.043) * P.drift[0] + Math.sin(t * 0.017 + 2.0) * P.drift[0] * 0.5;
  pg.z = pg.z0 + Math.sin(t * 0.031 + 1.0) * P.drift[1];
  const g = P.waveGain;
  const h = waveH(pg.x, pg.z, t) * g;
  const e = 0.45;
  const sx = (waveH(pg.x + e, pg.z, t) - waveH(pg.x - e, pg.z, t)) / (2 * e) * g;
  const sz = (waveH(pg.x, pg.z + e, t) - waveH(pg.x, pg.z - e, t)) / (2 * e) * g;
  pg.h = pg.h + (h - pg.h) * 0.35;                      // a little inertia: it floats, it doesn't ride the field rigidly

    pg.nextTurn = t + 5 + rand(pg) * 8;

  if (t >= pg.nextFlip) { pg.flipAt = t; pg.nextFlip = t + 9 + rand(pg) * 12; pg.dbl = rand(pg) < 0.3; }

/* --------------------------- layout & quality -------------------------- */
function layout() {
  const C = CONFIG.camera;
  S.cssW = Math.max(1, window.innerWidth); S.cssH = Math.max(1, window.innerHeight);
  S.aspect = S.cssW / S.cssH;
  S.f = C.focal + (C.focalPortrait - C.focal) * clamp((1 - S.aspect) / 0.55, 0, 1);
  S.hz = 1 - 2 * C.horizon;
  // sun
  const sp = [(2 * CONFIG.sun.x - 1) * S.aspect, S.hz + 2 * CONFIG.sun.above];
  const d = [sp[0], sp[1] - S.hz, -S.f], l = Math.hypot(d[0], d[1], d[2]);
  S.sun = [d[0] / l, d[1] / l, d[2] / l]; S.sunS = sp;
  S.sunCP = [S.sun[0] / (S.sun[1] + 0.10), S.sun[2] / (S.sun[1] + 0.10)];
  // penguin anchor
  const P = CONFIG.penguin, pyT = S.hz + (-1 - S.hz) * P.below, pxT = (2 * P.x - 1) * S.aspect;
  const dz = S.f * C.height / (S.hz - pyT);

    const gl = S.gl, L = S.loc;
    gl.uniform3f(L.uSun, S.sun[0], S.sun[1], S.sun[2]);
    gl.uniform2f(L.uSunS, S.sunS[0], S.sunS[1]);

function applySize() {

  const W2 = Math.max(160, Math.round(w * sc)), H2 = Math.max(160, Math.round(h * sc));
  if (canvas.width !== W2 || canvas.height !== H2) {
    canvas.width = W2; canvas.height = H2;

S.lastUp = -1e9;

/* -------------------------------- frame -------------------------------- */
function draw() {

  gl.uniform1f(L.uT, t);

function step(dt) {            // debug / deterministic: advance simulated seconds and draw

function frame(now) {

}

window.addEventListener('resize', () => {

/* --------------------------------- boot -------------------------------- */
async function boot() {

  layout();

  const t0 = performance.now();

  S.B = await bakeBand(SP.chop, CONFIG.seed * 101 + 2, 16);
  S.noise = bakeNoise();

  console.info('[ocean] baked in ' + S.bakeMs.toFixed(0) + 'ms; comps ' + S.A.comps + '/' + S.B.comps +
               '; slopeMax ' + S.A.sMax.toFixed(3) + '/' + S.B.sMax.toFixed(3) + '; hMax ' + S.A.hMax.toFixed(2) +

  S.t = 12 + Math.random() * 40;
  draw();
  if (/[?&]nofade/.test(location.search)) canvas.style.transition = 'none';
  requestAnimationFrame(() => canvas.classList.add('on'));
  start();
}

window.__ocean = {
  config: CONFIG, state: S,
  step, draw: () => S.ready && draw(),
  get scale() { return S.quality; },
  setScale(s) { S.quality = clamp(s, 0.25, 1); S.ceiling = Math.max(S.ceiling, S.quality); applySize(); if (S.ready && !S.running) draw(); },
  setTime(t) { S.t = t; if (S.ready) draw(); },
  get frameMs() { return S.ema; },
  get penguin() { return S.pg; },
  stop, start
};
boot();
})();
</script>
